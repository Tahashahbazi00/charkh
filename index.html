:root{
 --bg:#eceff5;--surface:#ffffff;--surface2:#e3e8f1;--surface3:#d6dde9;
 --ink:#121c33;--muted:#56647f;--line:#cfd7e5;
 --accent:#eeaa2c;--on-accent:#1c1400;--accent-ink:#8a5500;
 --good:#0b7f55;--bad:#c23a3a;--info:#1f62c9;--violet:#6a4cc4;--warn:#a8630a;
 --good-bg:#dcf3e8;--bad-bg:#fbe3e3;--shadow:0 6px 24px rgba(18,28,51,.12);
 --font:'Vazirmatn','Vazir',Tahoma,system-ui,sans-serif;--display:'Lalezar','Vazirmatn',Tahoma,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#0b1220;--surface:#141e35;--surface2:#1c2947;--surface3:#26365a;

 --accent:#f2b134;--on-accent:#1c1400;--accent-ink:#f2b134;
 --good:#43d495;--bad:#ff7b7b;--info:#6aaeff;--violet:#b39bff;--warn:#f2b134;
 --good-bg:#12382d;--bad-bg:#40202a;--shadow:0 6px 24px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{

 --ink:#e9eefb;--muted:#92a1c0;--line:#2a3a5f;
 --accent:#f2b134;--on-accent:#1c1400;--accent-ink:#f2b134;
 --good:#43d495;--bad:#ff7b7b;--info:#6aaeff;--violet:#b39bff;--warn:#f2b134;
 --good-bg:#12382d;--bad-bg:#40202a;--shadow:0 6px 24px rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
html{direction:rtl}
body{direction:rtl;margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.7;
 padding-block:0;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px));overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
#app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;position:relative}
.gut{padding-left:16px;padding-right:16px}
/* هدر */
#hd{flex:none;display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.av{flex:none;width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-family:var(--display);font-size:22px}
.hd-t{min-width:0;flex:1}
.hd-n{font-weight:800;font-size:16px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd-s{font-size:12.5px;color:var(--muted);line-height:1.4}
.hd-e{text-align:left;flex:none}
.hd-e b{display:block;font-size:13px;font-variant-numeric:tabular-nums}
.hd-e span{font-size:11.5px;color:var(--muted)}
/* بدنه */
#mn{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:14px 16px 20px;display:flex;flex-direction:column;gap:12px}
h2{font-family:var(--display);font-weight:400;font-size:22px;margin:4px 0 0;line-height:1.3;letter-spacing:0}
h3{font-size:14px;font-weight:800;margin:0;color:var(--muted);letter-spacing:.2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.flat{background:transparent;border:0;padding:0}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.row.sp{justify-content:space-between}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.sm{font-size:12.5px;line-height:1.6}
.xs{font-size:11.5px}
.num{font-variant-numeric:tabular-nums}
.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}.info{color:var(--info)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
@media(max-width:360px){.grid3{grid-template-columns:1fr 1fr}}
.kv{background:var(--surface2);border-radius:10px;padding:8px 10px;min-width:0}
.kv small{display:block;font-size:11.5px;color:var(--muted);line-height:1.5}
.kv b{display:block;font-size:13.5px;font-weight:700;overflow-wrap:anywhere}
/* آمار */
.stat{display:grid;grid-template-columns:56px 1fr 34px;gap:8px;align-items:center;font-size:13px}
.bar{height:9px;background:var(--surface3);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;transition:width .4s}
.stat b{text-align:left;font-size:12.5px}
/* دکمه */
.btn{appearance:none;border:0;border-radius:11px;padding:9px 14px;min-height:42px;background:var(--surface2);color:var(--ink);font-weight:700;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center;line-height:1.35}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--accent);color:var(--on-accent)}
.btn.good{background:var(--good);color:#fff}
.btn.bad{background:var(--bad-bg);color:var(--bad)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.sm{min-height:34px;padding:5px 11px;font-size:13px;border-radius:9px}
.btn.blk{width:100%}
.btn[disabled]{opacity:.42;cursor:not-allowed;transform:none}
.btn:focus-visible,.tab:focus-visible,.chip:focus-visible,.item:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chip{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:500;cursor:pointer;min-height:34px;white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.scrollx{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.scrollx::-webkit-scrollbar{display:none}
.pill{display:inline-block;padding:1px 9px;border-radius:999px;font-size:11.5px;font-weight:700;background:var(--surface2);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)}.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.acc{background:var(--accent);color:var(--on-accent)}
/* آیتم لیست */
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);min-width:0;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:right;cursor:pointer}
.item:first-child{border-top:0}
.item .fl{font-size:26px;line-height:1;flex:none;width:34px;text-align:center}
.item .tt{flex:1;min-width:0}
.item .tt b{display:block;font-size:14.5px}
.item .tt span{display:block;font-size:12px;color:var(--muted);line-height:1.5}
.item .en{flex:none;text-align:left;font-variant-numeric:tabular-nums;font-size:13.5px;font-weight:700}
.item .en span{display:block;font-size:11.5px;font-weight:700}
.chev{color:var(--muted);flex:none;font-size:18px}
/* فید */
.feed{display:flex;flex-direction:column}
.fd{display:grid;grid-template-columns:38px 1fr;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px;line-height:1.65}
.fd:first-child{border-top:0}
.fd .ag{font-size:11.5px;color:var(--muted);font-weight:700;padding-top:2px}
.fd.mig b,.fd.sec b{color:var(--info)}

#dk .btn{flex:1}

#nv{flex:none;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:0}

.tab svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--accent-ink)}
.tab.on svg{stroke:var(--accent-ink)}
.tab.on::after{content:"";width:22px;height:3px;border-radius:2px;background:var(--accent);margin-top:1px}
.back{display:flex;align-items:center;gap:6px;color:var(--accent-ink);font-weight:700;background:none;border:0;padding:4px 0;cursor:pointer;min-height:36px;align-self:flex-start}

.hero-fx .big{font-family:var(--display);font-size:34px;line-height:1.25;font-variant-numeric:tabular-nums}
.chg{display:flex;gap:8px;flex-wrap:wrap}
.chg span{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--surface2);font-variant-numeric:tabular-nums}
.chg .up{color:var(--good);background:var(--good-bg)}.chg .dn{color:var(--bad);background:var(--bad-bg)}
.chart{width:100%;height:auto;display:block;color:var(--accent-ink)}
.chart text{fill:var(--muted);font-size:9.5px;font-family:var(--font)}
.news{padding:9px 0;border-top:1px solid var(--line);font-size:13.5px;line-height:1.65}
.news:first-child{border-top:0}
.news small{display:block;color:var(--muted);font-size:11.5px}
input[type=text],input[type=number],input[type=search],select,textarea{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-height:42px;color:var(--ink)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface2);border-radius:11px;padding:3px;gap:3px}
.seg button{appearance:none;border:0;background:none;border-radius:9px;padding:8px 4px;font-weight:700;font-size:13.5px;color:var(--muted);cursor:pointer;min-height:38px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.18)}
.seg.buy button.on{background:var(--good);color:#fff}.seg.sell button.on{background:var(--bad);color:#fff}
.tabs-sm{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px}
/* مودال و شیت */
#ov{position:fixed;inset:0;z-index:50;pointer-events:none}
.bd{position:fixed;inset:0;background:rgba(5,9,20,.55);display:flex;align-items:flex-end;justify-content:center;pointer-events:auto;
 padding-top:max(16px,env(safe-area-inset-top,0px));padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.sheet{width:100%;max-width:520px;max-height:90%;background:var(--bg);border-radius:20px 20px 0 0;display:flex;flex-direction:column;box-shadow:var(--shadow);animation:up .22s ease-out}
.sheet.ctr{border-radius:20px;margin:auto 16px;max-height:86%}
.bd.mid{align-items:center}
.sh-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 8px}
.sh-h h2{margin:0;font-size:21px}
.sh-b{overflow-y:auto;padding:4px 16px 16px;display:flex;flex-direction:column;gap:12px;overscroll-behavior:contain}
.sh-f{padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line)}
.x{appearance:none;border:0;background:var(--surface2);width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer;flex:none;line-height:1}

.wheel.spin{animation:spin 2.4s linear infinite}

#toast{position:fixed;left:0;right:0;bottom:calc(150px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none;z-index:60;padding:0 16px}
#toast div{background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:12px;font-size:13.5px;font-weight:700;max-width:420px;text-align:center;box-shadow:var(--shadow);animation:up .2s}

.choice{width:100%;justify-content:flex-start;text-align:right;padding:11px 14px;font-weight:600}
.big-title{font-family:var(--display);font-size:46px;line-height:1.2;margin:0}
.title-wrap{height:100%;overflow-y:auto;padding:28px 16px 24px;display:flex;flex-direction:column;gap:14px}
.wheel{width:84px;height:84px;color:var(--accent)}
.fam-bar{height:7px}
details summary{cursor:pointer;font-weight:700;padding:6px 0}
hr{border:0;border-top:1px solid var(--line);margin:2px 0;width:100%}
.empty{color:var(--muted);text-align:center;padding:14px 0;font-size:13.5px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

const FX = {

 inflOf(w,k){const ids=CUR_CC[k]||['US'];let s=0;ids.forEach(i=>s+=w.eco[i].infl);return s/ids.length},
 step(w,day){

   if(c.peg){w.x[k]+=(Math.log(c.u)-w.x[k])*.05+c.v*R.g(); w.shock[k]=s*.8; continue}
   const ap=s*.2; w.shock[k]=s-ap;
   let rev=0;
   if(w.live){const ids=CUR_CC[k]||['US'];let pk=0;ids.forEach(i=>pk+=w.eco[i].price);pk/=ids.length;const tg=k==='XAU'?Math.log(c.u)+Math.log(w.eco.US.price):Math.log(c.u)-Math.log(pk/w.eco.US.price);rev=-.0005*(w.x[k]-tg)}
   w.x[k]+=-(FX.inflOf(w,k)-iu)*.85/360+(k==='XAU'?iu/360:0)+c.v*R.g()-c.b*dG+ap+rev;
  }
 },
 rec(w,day){
  for(const k in CUR){
   const v=FX.mid(w,k);
   const d=w.hd[k]||(w.hd[k]=[]); d.push(v); if(d.length>120)d.shift();
   if(day%30===0){const m=w.hm[k]||(w.hm[k]=[]); m.push(v); if(m.length>240)m.shift()}
   if(day%360===0){const y=w.hy[k]||(w.hy[k]=[]); y.push(v); if(y.length>40)y.shift()}
  }
 },
 /* قیمت یک واحد base بر حسب quote */

 series(S,base,quote,range){

  const lim=range==='d'?30:range==='m'?24:20;

 },
 change(S,base,quote){

  const cur=FX.price(S,base,quote), L=hd.length;

  const d1=L>1?cur/at(hd,qd,1)-1:0, d30=L>30?cur/at(hd,qd,30)-1:0;
  const mi=Math.min(12,hm.length-1), y1=mi>0?cur/at(hm,qm,mi)-1:0;

 },
 news(S){

/* ===== کیف پول چندارزی ===== */
const Wal = {
 H:(S,c)=>S.wal[c]||(S.wal[c]={a:0,c:0}),
 ref:(S,c)=>FX.mid(S.world,c)/FX.mid(S.world,S.homeCur),
 add(S,c,x,cost){
  if(!(x>0))return; const h=Wal.H(S,c);
  if(h.a<0){const left=h.a+x; h.a=left; if(left>0)h.c=left*Wal.ref(S,c); return}
  h.a+=x; h.c+=cost!=null?cost:x*Wal.ref(S,c);
 },
 rem(S,c,x){
  const h=Wal.H(S,c);
  if(h.a>0){const t=Math.min(x,h.a); h.c-=h.c*(t/h.a)}
  h.a-=x; if(Math.abs(h.a)<1e-7){h.a=0;h.c=0}
  if(h.a<=0)h.c=0;
 },
 pay(S,amt,c){
  if(!(amt>0))return 0;
  if(S.house==='family'&&ageOf(S)<18)return 0;
  let need=amt; const h=Wal.H(S,c);
  if(h.a>0){const t=Math.min(h.a,need); Wal.rem(S,c,t); need-=t}
  if(need>1e-9){
   const o=Object.keys(S.wal).filter(k=>k!==c&&k!=='XAU'&&S.wal[k].a>0).sort((a,b)=>S.wal[b].a*FX.mid(S.world,b)-S.wal[a].a*FX.mid(S.world,a));
   for(const k of o){const e=FX.eff(S.world,k,c),av=S.wal[k].a*e; if(av>=need){Wal.rem(S,k,need/e);need=0;break} need-=av;Wal.rem(S,k,S.wal[k].a)}
  }
  if(need>1e-9&&S.bank)need=Bank.pull(S,c,need);
  if(need>1e-9)Wal.H(S,c).a-=need;
  return need;
 },
 /* ارزش کل کیف پول به یک ارز */
 total(S,c){let t=0;for(const k in S.wal)if(k!=='XAU')t+=S.wal[k].a*FX.mid(S.world,k);return t/FX.mid(S.world,c)},
 gold(S,c){const h=S.wal.XAU;return h?h.a*FX.mid(S.world,'XAU')/FX.mid(S.world,c):0},
 /* نقد قابل‌پرداخت به یک ارز (بدون اضافه‌برداشت): موجودی مثبت + ارزهای دیگر با کارمزد + سپرده‌ها */
 avail(S,c){
  let t=Math.max(0,(S.wal[c]||{a:0}).a);
  for(const k in S.wal){if(k===c||k==='XAU')continue;if(S.wal[k].a>0)t+=S.wal[k].a*FX.eff(S.world,k,c)}
  if(S.bank)for(const k in S.bank.dep){const d=S.bank.dep[k].a;if(d>0)t+=(k===c?d:d*FX.eff(S.world,k,c))}
  return t;
 },
 worth(S,c){
  let t=Wal.total(S,c)+Wal.gold(S,c);
  S.props.forEach(p=>{t+=p.v*FX.mid(S.world,CTY[p.cc].cur)/FX.mid(S.world,c)});
  (S.cars||[]).forEach(p=>{t+=p.v*FX.mid(S.world,CTY[p.cc].cur)/FX.mid(S.world,c)});
  if(S.bank)t+=Bank.net(S,c);
  if(S.biz)t+=S.biz.v*FX.mid(S.world,CTY[S.biz.cc].cur)/FX.mid(S.world,c);
  return t;
 },
 usd:S=>Wal.worth(S,'USD'),
 liquidUSD:S=>Wal.total(S,'USD'),
 /* هزینه / درآمد بر پایه دلار پایه */
 U:(S,cc)=>Eco.U(S,cc||S.country),
 loc:(S,usd,cc)=>usd*Eco.U(S,cc||S.country),
 earn(S,usd,cc){cc=cc||S.country;Wal.add(S,CTY[cc].cur,usd*Eco.U(S,cc))},
 spend(S,usd,cc){cc=cc||S.country;return Wal.pay(S,usd*Eco.U(S,cc),CTY[cc].cur)},
 cur:S=>CTY[S.country].cur,
 /* تبدیل ارز */
 convert(S,from,to,amt){
  const h=S.wal[from]; if(!h||amt<=0||amt>h.a+1e-9||from===to)return null;
  const e=FX.eff(S.world,from,to), got=amt*e;
  const costMoved=h.c*(Math.min(amt,h.a)/h.a);
  Wal.rem(S,from,amt); Wal.add(S,to,got,costMoved);
  return got;
 }
};

 best:(S,cc)=>Math.max(...CTY[cc].langs.map(l=>S.lang[l]||0)),
 bestName:(S,cc)=>{let b=CTY[cc].langs[0];CTY[cc].langs.forEach(l=>{if((S.lang[l]||0)>(S.lang[b]||0))b=l});return b},
 study(S,lc){
  if(!Act.ap(S))return 'امتیاز ماه تمام شده';
  Wal.spend(S,40); const g=Math.round(R.i(6,12)*(.6+S.st.sm/100));
  S.lang[lc]=Math.min(100,(S.lang[lc]||0)+g); chg(S,{hap:-1,sm:.3});
  return 'مهارت '+LANG[lc]+' '+P(g)+' واحد بیشتر شد (اکنون '+P(S.lang[lc])+')';
 },
 immerse(S){CTY[S.country].langs.forEach(l=>{const v=S.lang[l]||0;S.lang[l]=Math.min(100,v+(v<70?1.6:.5))})}
};
const Act = {
 ap(S){if(S.ap<=0)return false;S.ap--;return true},
 gym(S){if(!Act.ap(S))return 'امتیاز ماه تمام شده';Wal.spend(S,15);chg(S,{hp:R.i(1,3),lk:R.r(0,1),hap:2});return 'ورزش کردی؛ سلامت و ظاهرت بهتر شد'},
 social(S){if(!Act.ap(S))return 'امتیاز ماه تمام شده';Wal.spend(S,12);chg(S,{hap:R.i(2,5),rep:1,fame:S.st.fame<30?.3:0});return 'وقت خوبی با دوستان گذراندی'},
 study(S){if(!Act.ap(S))return 'امتیاز ماه تمام شده';S.studied=(S.studied||0)+1;chg(S,{sm:S.st.sm<90?R.i(1,2):.3,hap:-1});return 'درس خواندی؛ هوشت بالاتر رفت'},
 overtime(S){if(!S.job&&!(S.mil&&S.mil.st==='active'))return 'شغلی نداری';if(!Act.ap(S))return 'امتیاز ماه تمام شده';if(S.job)S.job.perf=Math.min(100,S.job.perf+6);if(S.mil&&S.mil.st==='active')S.mil.perf=Math.min(100,S.mil.perf+5);chg(S,{hap:-2,hp:-.5});return 'اضافه‌کاری کردی؛ عملکردت بهتر شد'},
 network(S){if(!Act.ap(S))return 'امتیاز ماه تمام شده';Wal.spend(S,20);chg(S,{fame:S.st.fame<45?R.r(1,2.2):.3,rep:.5});return 'شبکه‌سازی کردی؛ شناخته‌تر شدی'},
 parttime(S){
  if(ageOf(S)<16)return 'هنوز برای کار کوچکی';
  if(Mig.rights(S,S.country)==='none')return 'اجازه کار نداری';
  if(!Act.ap(S))return 'امتیاز ماه تمام شده';
  const v=CTY[S.country].wage*.14; Wal.earn(S,v*(1-CTY[S.country].tax)); chg(S,{hap:-1});
  return 'کار پاره‌وقت کردی: '+M(v*(1-CTY[S.country].tax)*Wal.U(S),Wal.cur(S));
 }
};

/* ===== آموزش ===== */
const Edu = {
 tuition:(S,cc)=>CTY[cc].tuit*Eco.U(S,cc),
 admit(S,cc,prog,major){
  let p=36+S.st.sm*.55-(CTY[cc].q-5)*3.2+(S.edu.sg-12)*1.5;
  if(prog==='msc')p-=6; if(prog==='phd')p-=12; if(major==='med')p-=22;
  if(S.country!==cc||Mig.rights(S,cc)==='none')p-=8;
  return R.k(p,4,95);
 },
 check(S,prog,major){
  const P0=PROGS[prog]; if(S.edu.uni)return 'در حال تحصیل هستی';
  if(ageOf(S)<17)return 'هنوز سنت کم است';
  if(S.edu.lvl<P0.min)return 'مدرک '+EDU_L[P0.min]+' لازم است';
  if(prog==='bsc'&&S.edu.lvl>=3)return 'کارشناسی داری';
  if(prog==='msc'&&S.edu.lvl>=4)return 'ارشد داری';
  if(prog==='phd'&&S.edu.lvl>=5)return 'دکتری داری';
  if(S.mil&&S.mil.st==='conscript')return 'در دوران سربازی هستی';
  return '';
 },
 start(S,cc,prog,major){
  const P0=PROGS[prog], med=major==='med'&&prog==='bsc';
  S.edu.uni={cc,prog,major,y:0,tot:med?6:P0.y,lvl:med?4:P0.lvl,gpa:14,sch:false,defer:false};
  Edu.pay(S); log(S,'در رشته '+MAJORS[major]+' ('+P0.n+') در '+CTY[cc].n+' پذیرفته شدی','edu');
 },
 pay(S){const u=S.edu.uni;const c=Edu.tuition(S,u.cc)*(u.sch?.5:1);Wal.pay(S,c,CTY[u.cc].cur);u.sch=false},
 apply(S,prog,major){
  const w=Edu.check(S,prog,major); if(w)return w;
  const p=Edu.admit(S,S.country,prog,major)/100;
  if(Math.random()<p){Edu.start(S,S.country,prog,major);if(S.mil&&S.mil.ob==='due')S.mil.ob='deferred';return 'پذیرفته شدی!'}
  chg(S,{hap:-4});return 'این بار پذیرفته نشدی؛ دوباره تلاش کن';
 },
 quit(S){if(S.edu.uni){log(S,'تحصیل را رها کردی','edu');S.edu.uni=null;if(S.mil&&S.mil.ob==='deferred')S.mil.ob='due'}},
 yearly(S){
  const a=ageOf(S), e=S.edu;
  if(a>=6&&a<=17){
   e.sg=R.k(8+S.st.sm/12+R.g()*1.5+(S.studied||0)*.3,5,20);
   S.st.sm=R.k(S.st.sm+R.r(.3,1.6),0,100);
   S.lang.en=Math.min(100,(S.lang.en||0)+R.i(1,3)*(CTY[S.home].q>6?1.3:1));
   S.studied=0;
  }
  if(a===6)log(S,'وارد مدرسه شدی','edu');
  if(a===12)log(S,'دوره ابتدایی را تمام کردی','edu');
  if(a===15&&!e.drop){e.lvl=Math.max(e.lvl,1);log(S,'دوره اول متوسطه را تمام کردی (سیکل)','edu')}
  if(a===18&&!e.drop){e.lvl=Math.max(e.lvl,2);log(S,'دیپلم گرفتی؛ بزرگسال شدی!','edu')}
  const u=e.uni; if(!u)return;
  const gpa=R.k(7.5+S.st.sm/11+R.g()*1.6+Math.min(2,(S.studied||0)*.4),4,20); S.studied=0;
  u.gpa=u.y?(u.gpa*u.y+gpa)/(u.y+1):gpa;
  if(gpa<10){log(S,'در درس‌ها مردود شدی؛ سال را تکرار می‌کنی','edu');Edu.pay(S);chg(S,{hap:-6});return}
  u.y++; chg(S,{sm:1.2});
  if(gpa>=17){u.sch=true;log(S,'با معدل '+NF.format(Math.round(gpa*10)/10)+' بورسیه شدی (نصف شهریه)','edu')}
  if(u.y>=u.tot){
   e.lvl=Math.max(e.lvl,u.lvl); e.deg.push({prog:u.prog,major:u.major,lvl:u.lvl,cc:u.cc,gpa:u.gpa});
   log(S,'فارغ‌التحصیل شدی: '+(u.major==='med'&&u.prog==='bsc'?'دکترای پزشکی':PROGS[u.prog].n)+' '+MAJORS[u.major],'edu');
   chg(S,{fame:1,hap:8,sm:2}); const cc=u.cc; e.uni=null;
   if(S.mil&&S.mil.ob==='deferred')S.mil.ob='due';
   Mig.postStudy(S,cc);
  } else Edu.pay(S);
 }
};

/* ===== شغل ===== */
const Career = {
 sal:(S,job)=>CTY[job.cc].wage*JOB[job.id].m*LV[job.l-1]*Cty.get(S,job.cc,job.city).wage*Eco.U(S,job.cc),
 net:(S,job)=>Career.sal(S,job)*(1-CTY[job.cc].tax),
 hasMajor:(S,j)=>S.edu.deg.some(d=>d.lvl>=3&&j.mj.includes(d.major)),
 elig(S,id){
  const j=JOB[id], cc=S.country, a=ageOf(S), eco=S.world.eco[cc];
  const out={ok:false,why:'',p:0};
  if(a<16){out.why='سن کم';return out}
  if(S.edu.uni&&!['labor','driver','chef','sales'].includes(id)){out.why='در حال تحصیل';return out}
  if(S.mil&&S.mil.st==='conscript'){out.why='در دوران سربازی';return out}
  if(S.mil&&S.mil.st==='active'){out.why='در خدمت نظامی';return out}
  if(S.pol&&S.pol.l>0){out.why='مسئولیت سیاسی';return out}
  const r=Mig.rights(S,cc); if(r==='none'){out.why='مجوز کار نداری';return out}
  if(r==='part'&&!['labor','driver','chef','sales'].includes(id)){out.why='ویزای دانشجویی فقط کار ساده';return out}
  if(S.edu.lvl<j.e){
   if(!(j.alt&&S.edu.lvl>=j.alt.e&&S.st.sm>=j.alt.sm)){out.why='مدرک '+EDU_L[j.e]+' لازم است';return out}
  }
  if(j.mj&&!Career.hasMajor(S,j)&&!(j.alt&&S.edu.lvl>=j.alt.e&&S.st.sm>=j.alt.sm)){out.why='رشته '+j.mj.map(m=>MAJORS[m]).join('/');return out}
  const lb=Lang.best(S,cc), need=CTY[cc].need;
  let p=48+(S.st.sm-50)*.35+Math.min(15,S.exp*1.5)+(S.edu.lvl-j.e)*4-eco.unemp*100*1.3+Math.min(6,S.st.fame*.1)+R.k((lb-need*.7)*.14,-14,6);
  if(S.country!==S.home&&!S.cit.includes(cc))p-=3;
  out.ok=true; out.p=R.k(p,6,92)/100;
  out.l=R.k(1+Math.floor((S.exp+(S.edu.lvl-j.e)*2)/5),1,3);
  return out;
 },
 apply(S,id){
  const e=Career.elig(S,id); if(!e.ok)return e.why;
  if(!Act.ap(S))return 'امتیاز ماه تمام شده';
  if(Math.random()<e.p){S.job={id,l:e.l,cc:S.country,city:S.city,perf:55,y:0};log(S,'استخدام شدی: '+JOB[id].t[e.l-1],'job');chg(S,{hap:6});return 'استخدام شدی! '+JOB[id].t[e.l-1]}
  chg(S,{hap:-2});return 'مصاحبه موفق نبود';
 },
 quit(S){if(S.job){log(S,'از شغل «'+JOB[S.job.id].t[S.job.l-1]+'» استعفا دادی','job');S.job=null}},
 yearly(S){
  const j=S.job; if(!j)return; S.exp++; j.y++;
  const eco=S.world.eco[j.cc];
  if(R.c(.03+eco.unemp*.6+(j.perf<30?.18:0))){log(S,'اخراج شدی','job');chg(S,{hap:-10});S.job=null;return}
  if(j.l<5&&R.c(R.k(.1+(j.perf-40)/250+S.st.sm/700,.03,.5))){j.l++;log(S,'ارتقا گرفتی: '+JOB[j.id].t[j.l-1],'job');chg(S,{hap:6,fame:j.l>=4?2:.3})}
  if(j.l>=4)chg(S,{fame:1});
 },
 monthly(S){
  const j=S.job; if(!j)return;
  if(Mig.rights(S,j.cc)==='none'||(S.country!==j.cc)||(j.city!==S.city)){log(S,'شغل خود را به‌خاطر نبود مجوز/جابه‌جایی از دست دادی','job');S.job=null;return}
  j.perf=R.k(j.perf+(50+(S.st.sm-50)/4-j.perf)*.08+R.g()*3,0,100);
  let g=Career.sal(S,j); if(JOB[j.id].vary)g*=R.r(.4,1.8);
  const tax=CTY[j.cc].tax; Wal.add(S,CTY[j.cc].cur,g*(1-tax)); S.lastInc=g*(1-tax);
 }
};

/* ===== مسکن و ملک ===== */
const Home = {
 price(S,cc,t,city){return CTY[cc].house*PROP[t].m*Cty.get(S,cc,city).house*Eco.U(S,cc)*S.world.eco[cc].house},
 homeProp:S=>S.props.find(p=>p.home),
 living(S){
  const c=CTY[S.country],U=Eco.U(S,S.country),a=ageOf(S),ct=Cty.get(S,S.country);
  if(S.mil&&S.mil.st==='conscript')return 0;
  const kids=S.fam.kids.filter(k=>k.a<18).length, hh=1+(S.fam.pt&&S.fam.pt.m&&S.fam.pt.cc===S.country?.6:0);
  let cost;
  if(S.house==='family'){cost=a<18?0:c.col*ct.col*U*.4*LIFE_M[S.life]}
  else { cost=c.col*ct.col*U*LIFE_M[S.life]*hh;
   if(S.house==='rent')cost+=c.rent*ct.rent*U*(S.life===2?1.4:S.life===0?.8:1);
   else {const hp=Home.homeProp(S);cost+=hp?hp.v*.0012:0}
  }
  cost+=kids*c.col*ct.col*U*.3;
  return cost;
 },
 rent(S){if(ageOf(S)<18)return 'هنوز کم‌سن هستی';S.house='rent';S.props.forEach(p=>{if(p.cc===S.country)p.home=false});log(S,'خانه اجاره کردی','home');return 'خانه اجاره کردی'},
 canBuy(S,cc){
  if(ageOf(S)<18)return 'باید ۱۸ سال داشته باشی';
  if(CTY[cc].fb)return ''; const st=Mig.status(S,cc);
  return st?'':'خرید ملک برای خارجی‌ها در این کشور نیازمند اقامت است';
 },
 buy(S,cc,t,live,city,loanN){
  const w=Home.canBuy(S,cc); if(w)return w;
  city=city==null?(cc===S.country?S.city:0):city;
  const pr=Home.price(S,cc,t,city), cur=CTY[cc].cur, fee=pr*.03, down=loanN?pr*.2:pr;
  if(Wal.avail(S,cur)<down+fee-1e-9)return 'پول کافی نداری';
  if(loanN){const e=Bank.eligible(S,'mortgage',pr*.8,loanN,cur);if(e)return e}
  Wal.pay(S,down+fee,cur);
  const p={id:'p'+S.day+Math.floor(Math.random()*99999),cc,city,t,v:pr,b:pr,home:false,own:'me'};
  S.props.push(p); Docs.create(S,'property',p,pr,cur,'purchase','فروشنده');
  if(loanN)Bank.create(S,'mortgage',cur,pr*.8,loanN,p.id,true);
  if(live&&cc===S.country&&city===S.city){S.props.forEach(x=>{if(x!==p)x.home=false});p.home=true;S.house='own'}
  log(S,PROP[t].n+' در '+Cty.name(cc,city)+'، '+CTY[cc].n+' خریدی','home'); chg(S,{hap:5});
  return PROP[t].n+' خریدی؛ سند را امضا کن';
 },
 sell(S,id){
  const r=Docs.sell(S,id); return r;
 },
 monthly(S){
  S.props.forEach(p=>{
   const e=S.world.eco[p.cc]; p.v*=1+e.infl/12*.9+((e.growth-.02)*.2+R.g()*.008)/12+(e.house-1)*0;
   if(!p.home){Wal.add(S,CTY[p.cc].cur,p.v*CTY[p.cc].yld/100/12*.85)}
   else p.v*=1;
  });
 }
};

/* ===== خانواده ===== */
const Fam = {
 mkPerson(S,g,age,nat){
  const lc=CTY[nat].langs[0], pool=(NAMES[lc]||NAMES.en)[g==='m'?'m':'f'];
  return {n:R.p(pool),g,a:age,nat,cc:nat,lk:R.i(30,92),sm:R.i(30,90),inc:R.r(.3,1.2)};
 },
 init(S,cls){
  S.par={cls,pa:R.i(26,34),alive:true,est:[3000,20000,100000,500000][cls]*R.r(.6,1.6)};
  S.fam={pt:null,kids:[],plan:false};
 },
 candidates(S){
  const out=[], a=ageOf(S), g=S.g==='m'?'f':'m';
  for(let i=0;i<3;i++){
   const loc=R.c(.7), nat=loc?S.country:R.p(CTY_IDS);
   const c=Fam.mkPerson(S,g,Math.max(18,a+R.i(-4,6)),nat);
   c.cc=nat===S.country||R.c(.55)?S.country:nat;
   out.push(c);
  }
  return out;
 },
 chance(S,c){
  const w=Math.max(0,Math.log10(Math.max(1,Wal.usd(S)/4000))*6);
  return R.k(30+S.st.lk*.28-(c.lk-60)*.15+S.st.fame*.22+S.st.rep*.08+Math.min(14,w)+(S.st.sm-50)*.05,8,90)/100;
 },
 ask(S,c){
  if(S.fam.pt)return 'شریک داری';
  if(!Act.ap(S))return 'امتیاز ماه تمام شده';
  Wal.spend(S,25);
  if(Math.random()<Fam.chance(S,c)){S.fam.pt=Object.assign({},c,{mood:62,m:false,since:S.day});chg(S,{hap:10});log(S,'با '+c.n+' وارد رابطه شدی','fam');return c.n+' پیشنهادت را پذیرفت!'}
  chg(S,{hap:-3});return c.n+' علاقه‌ای نشان نداد';
 },
 marry(S,size){
  const pt=S.fam.pt; if(!pt||pt.m)return 'ممکن نیست';
  if(pt.mood<55)return 'رابطه هنوز به اندازه کافی محکم نیست';
  if(ageOf(S)<18)return 'کم‌سن هستی';
  const cost=CTY[S.country].wage*[1,3,9][size];
  Wal.spend(S,cost); pt.m=true; pt.mood=Math.min(100,pt.mood+[3,8,12][size]); chg(S,{hap:[8,14,18][size],fame:size===2?1.5:0});
  if(pt.cc!==S.country&&pt.nat===S.country)pt.cc=S.country;
  log(S,'با '+pt.n+' ازدواج کردی','fam'); return 'ازدواج کردید!';
 },
 breakup(S){
  const pt=S.fam.pt; if(!pt)return '';
  if(pt.m){ for(const k in S.wal){const t=S.wal[k].a>0?S.wal[k].a*.35:0;if(t>0)Wal.rem(S,k,t)} chg(S,{hap:-15}); log(S,'از '+pt.n+' جدا شدی؛ ۳۵٪ دارایی نقدی تقسیم شد','fam') }
  else{chg(S,{hap:-8});log(S,'رابطه‌ات با '+pt.n+' تمام شد','fam')}
  S.fam.pt=null; return 'جدا شدید';
 },
 monthly(S){
  const pt=S.fam.pt; if(!pt)return;
  const tgt=55+(S.st.hap-50)*.25+(pt.m&&pt.cc===S.country?8:0)-(pt.cc!==S.country?25:0)+(S.job||S.mil?3:-3);
  pt.mood=R.k(pt.mood+(tgt-pt.mood)*.12+R.g()*2,0,100);
  if(pt.m&&pt.cc===S.country){ const inc=CTY[S.country].wage*pt.inc*(1-CTY[S.country].tax)*(pt.w===0?0:.7); Wal.earn(S,inc) }
  if(!pt.m&&pt.mood<18){log(S,pt.n+' رابطه را تمام کرد','fam');S.fam.pt=null;chg(S,{hap:-8})}
 },
 yearly(S){
  const a=ageOf(S), f=S.fam, pt=f.pt;
  if(pt){pt.a++}
  f.kids.forEach(k=>{k.a++;if(k.a===18)log(S,k.n+' به ۱۸ سالگی رسید','fam')});
  if(pt&&pt.m&&pt.cc===S.country&&a<=46&&pt.a<=44&&f.kids.length<5){
   if(R.c(f.plan?.5:.12)){
    const g=R.c(.5)?'m':'f', nm=R.p((NAMES[CTY[S.country].langs[0]]||NAMES.en)[g]);
    f.kids.push({n:nm,g,a:0}); f.plan=false; chg(S,{hap:14,hp:-1});
    log(S,'فرزندتان '+nm+' به دنیا آمد','fam'); info(S,'فرزند تازه',(g==='m'?'پسری':'دختری')+' به نام '+nm+' به خانواده‌ات اضافه شد. هزینه‌های ماهانه بیشتر می‌شود.','fam');
   }
  }
  const p=S.par; if(p&&p.alive){p.pa++;
   if(p.pa>=62&&R.c(Math.pow((p.pa-60)/34,2)*.9)){
    p.alive=false; const est=p.est*Eco.U(S,S.home);
    Wal.add(S,CTY[S.home].cur,est); chg(S,{hap:-14});
    log(S,'والدینت درگذشتند؛ ارثیه: '+M(est,CTY[S.home].cur),'fam');
    if(p.cls>=2&&R.c(.6)){const t=p.cls===3?'villa':'apt',ct=R.i(0,2),pv=Home.price(S,S.home,t,ct)*.8;const as={id:'p'+S.day+Math.floor(Math.random()*99999),cc:S.home,city:ct,t,v:pv,b:pv,home:false,own:'me'};S.props.push(as);Docs.inherit(S,'property',as,'والدین');log(S,'یک '+PROP[t].n+' در '+Cty.name(S.home,ct)+' از والدینت به ارث بردی؛ سند را امضا کن','home')}
    info(S,'فقدان والدین','والدینت در سن '+P(p.pa)+' سالگی درگذشتند. از آن‌ها '+M(est,CTY[S.home].cur)+' به تو رسید.','fam');
   }
  }
 }
};

/* ===== سیاست ===== */
const Pol = {
 cost:(S,l)=>CTY[S.country].wage*[0,1.5,5,15,40,100][l],
 can(S,l){
  const q=POL_REQ[l]; if(!q)return 'نامعتبر';
  if(!S.cit.includes(S.country))return 'فقط شهروندان می‌توانند نامزد شوند';
  if(ageOf(S)<q.age)return 'حداقل سن '+P(q.age);
  if(S.st.fame<q.fame)return 'شهرت '+P(q.fame)+' لازم است';
  if(S.edu.lvl<2)return 'دیپلم لازم است';
  if(S.pol&&S.pol.l>=l&&S.pol.on)return 'در حال حاضر در این سطح یا بالاتر هستی';
  if(S.mil&&S.mil.st==='active'&&S.mil.rank<8)return 'باید از ارتش بازنشسته شوی';
  if(S.mil&&S.mil.st==='conscript')return 'در دوران سربازی هستی';
  if(l>1&&(!S.pol||S.pol.l<l-1))return 'ابتدا باید سطح پایین‌تر را تجربه کنی';

 },
 chance(S,l){return R.k(26+S.st.fame*.32+S.st.rep*.3-S.st.en*.22-(l-1)*4,5,88)/100},
 run(S,l){
  const w=Pol.can(S,l); if(w)return w;

  }

 },
 sal:S=>S.pol&&S.pol.on?CTY[S.country].wage*POL_PAY[S.pol.l]*Eco.U(S,S.country)*(1-CTY[S.country].tax):0,

 monthly(S){
  const p=S.pol; if(!p||!p.on)return;

  S.st.fame=R.k(S.st.fame+.08*p.l,0,100);
  if(p.term<=0){
   S.queue.push({t:'پایان دوره '+POL_L[p.l],d:()=>'دوره‌ات تمام شد. برای دور تازه نامزد می‌شوی؟ هزینه کارزار '+M(Pol.cost(S,p.l)*Wal.U(S),Wal.cur(S)),
    c:[{t:'نامزدی دوباره',f:S=>{Wal.spend(S,Pol.cost(S,p.l));if(Math.random()<R.k(.35+S.st.rep*.004+S.st.fame*.003-S.st.en*.003,.1,.85)){p.term=48;chg(S,{fame:2,hap:6});log(S,'دوباره انتخاب شدی','pol');return 'دوباره انتخاب شدی'}p.on=false;chg(S,{hap:-8});log(S,'در انتخابات مجدد باختی','pol');return 'این بار رأی نیاوردی'}},
         {t:'کناره‌گیری',f:S=>{p.on=false;chg(S,{hap:-1});return 'دوران سیاسی‌ات تمام شد'}}]});
   p.term=999;
  }
 }
};

/* ===== کسب‌وکار ===== */
const Biz = {
 cost:(S,sec,size)=>BIZ_SEC[sec].min*[1,3,8][size]*Eco.U(S,S.country)*(CTY[S.country].wage/2500+.35),
 lvl(S){const b=S.biz;if(!b)return 0;const u=b.v/Eco.U(S,b.cc);return u<20000?0:u<100000?1:u<500000?2:u<3e6?3:4},
 start(S,sec,size,name){
  if(S.biz)return 'کسب‌وکار داری'; if(ageOf(S)<18)return 'کم‌سن هستی';
  const c=Biz.cost(S,sec,size), cur=Wal.cur(S);
  if(Wal.total(S,cur)<c)return 'سرمایه کافی نداری';
  Wal.pay(S,c,cur); S.biz={n:name||BIZ_SEC[sec].n,sec,cc:S.country,v:c,cash:0,v0:c,since:S.day,last:0};
  log(S,'کسب‌وکار «'+S.biz.n+'» را راه انداختی','biz'); chg(S,{hap:6,fame:1}); return 'راه‌اندازی شد';
 },
 invest(S,frac){
  const b=S.biz,cur=CTY[b.cc].cur,amt=Wal.total(S,cur)*frac; if(amt<=0)return 'پولی نداری';
  Wal.pay(S,amt,cur); b.v+=amt; return 'سرمایه‌گذاری شد'; },
 withdraw(S){const b=S.biz;if(!b||b.cash<=0)return 'سودی نیست';Wal.add(S,CTY[b.cc].cur,b.cash);const x=b.cash;b.cash=0;return 'برداشت: '+M(x,CTY[b.cc].cur)},
 sell(S){const b=S.biz;if(!b)return '';const x=b.v*.9+b.cash;Wal.add(S,CTY[b.cc].cur,x);log(S,'کسب‌وکار را فروختی: '+M(x,CTY[b.cc].cur),'biz');S.biz=null;return 'فروخته شد'},
 monthly(S){
  const b=S.biz; if(!b)return; const sc=BIZ_SEC[b.sec], e=S.world.eco[b.cc];
  b.v*=1+e.infl/12;
  let p=b.v*(sc.ret+sc.risk*R.g()*.012)*(1+(e.growth-.02)*3);
  if(b.sec==='trade'){const ch=FX.change(S,'USD',CTY[b.cc].cur).m;p*=1-R.k(ch,-.3,.3)*2}
  b.last=p; if(p>0){b.v+=p*.4;b.cash+=p*.6}else b.v+=p;
  if(b.v<b.v0*.2){log(S,'کسب‌وکارت ورشکست شد','biz');chg(S,{hap:-14,rep:-4});S.biz=null;return}
  const l=Biz.lvl(S); S.st.fame=Math.max(S.st.fame,Math.min(100,S.st.fame+(l*9-S.st.fame)*.01));
 }
};

/* ===== مهاجرت ===== */
const VISA_N = {student:'ویزای تحصیلی',work:'ویزای کاری',invest:'اقامت سرمایه‌گذاری',spouse:'ویزای همسری',resident:'اقامت دائم',citizen:'شهروندی'};
const VISA_FEE = {student:120,work:250,invest:1500,spouse:400,resident:600,citizen:900};
const Mig = {
 status(S,cc){
  if(S.cit.includes(cc))return {t:'citizen'};
  const v=S.vis[cc]; if(v&&(v.t==='resident'||v.until>S.day))return v; return null;
 },
 rights(S,cc){const s=Mig.status(S,cc);if(!s)return 'none';return s.t==='student'?'part':'full'},
 stLabel(S,cc){const s=Mig.status(S,cc);if(!s)return 'بدون ویزا';return {citizen:'شهروند',resident:'مقیم دائم',work:s.sp?'ویزای همسری':'ویزای کاری',student:'ویزای دانشجویی'}[s.t]},
 passport:S=>Math.max(...S.cit.map(x=>CTY[x].pass)),
 blocked(S){return S.mil&&S.mil.ob==='due'&&S.cit.includes(S.home)&&CTY[S.home].conscr>0&&ageOf(S)>=18?'تا زمان تعیین‌تکلیف سربازی ممنوع‌الخروج هستی':''},
 fee:(S,cc,type)=>VISA_FEE[type]*(1+CTY[cc].diff/10),
 /* فهرست مدارک لازم برای هر نوع درخواست؛ soft یعنی هشدار (مانع قطعی نیست) */
 docs(S,cc,type,x){
  const c=CTY[cc], lb=Lang.best(S,cc), liq=Wal.avail(S,'USD'), o=S.offers[cc], v=S.vis[cc];
  const out=[{n:'گذرنامه معتبر',ok:S.cit.length>0}];
  if(type==='student'){
   out.push({n:'مدرک دیپلم یا بالاتر',ok:S.edu.lvl>=2});
   out.push({n:'گواهی توان مالی ('+fm(c.fund)+' دلار)',ok:liq>=c.fund});
   if(x&&x.prog)out.push({n:'مدرک مقطع قبلی برای '+PROGS[x.prog].n,ok:S.edu.lvl>=PROGS[x.prog].min});
  } else if(type==='work'){
   out.push({n:'پیشنهاد کار معتبر',ok:!!(o&&o.exp>S.day)});
   out.push({n:'گواهی زبان (حداقل '+P(Math.ceil(c.need*.5))+')',ok:lb>=c.need*.5});
   out.push({n:'گواهی توان مالی ('+fm(c.fund*.3)+' دلار)',ok:liq>=c.fund*.3});
  } else if(type==='invest'){
   const pv=S.props.filter(q=>q.cc===cc).reduce((a,q)=>a+q.v*FX.mid(S.world,c.cur),0);
   out.push({n:'سند ملک امضاشده',ok:S.props.some(q=>q.cc===cc&&Docs.active(S,q.id)&&Docs.active(S,q.id).signed)});
   out.push({n:'ارزش ملک '+fm(c.inv)+' دلار',ok:pv>=c.inv});
  } else if(type==='spouse'){
   out.push({n:'گواهی ازدواج با شهروند این کشور',ok:!!(S.fam.pt&&S.fam.pt.m&&S.fam.pt.nat===cc)});
  } else if(type==='resident'){
   out.push({n:'ویزای کاری معتبر',ok:!!(v&&v.t==='work')});
   out.push({n:'سابقه‌ی اقامت '+P(c.res)+' سال',ok:!!(v&&v.mo>=c.res*12-(v.sp?24:0))});
   out.push({n:'گواهی زبان ('+P(c.need)+')',ok:lb>=c.need});
  } else if(type==='citizen'){
   out.push({n:'اقامت دائم',ok:!!(v&&v.t==='resident')});
   out.push({n:'سابقه‌ی اقامت '+P(c.cit)+' سال',ok:!!(v&&v.mo>=c.cit*12)});
   out.push({n:'گواهی زبان ('+P(c.need+10)+')',ok:lb>=c.need+10});
  }
  out.push({n:'گواهی عدم سوءپیشینه',ok:!S.flags.crime,soft:true});
  return out;
 },
 /* محاسبه شانس و شرایط هر نوع درخواست */
 eval(S,cc,type,x){
  const c=CTY[cc], r={ok:true,p:0,why:'',fee:Mig.fee(S,cc,type)};
  const bad=w=>{r.ok=false;r.why=w;return r};
  if(cc===S.country&&type!=='resident'&&type!=='citizen'&&Mig.status(S,cc)&&type!=='student')return bad('همین حالا اینجا مجوز داری');
  if(S.cit.includes(cc))return bad('شهروند این کشور هستی');
  if(S.apps.some(a=>a.cc===cc&&a.type===type))return bad('درخواست در جریان داری');
  const bl=(type==='resident'||type==='citizen')?'':Mig.blocked(S); if(bl)return bad(bl);
  const pass=Mig.passport(S), lb=Lang.best(S,cc), liq=Wal.avail(S,'USD'), crime=S.flags.crime?25:0;
  const dm=Mig.docs(S,cc,type,x).filter(d=>!d.ok&&!d.soft); if(dm.length)return bad('مدارک ناقص: '+dm.map(d=>d.n).join('، '));
  const diff=c.diff-(S.flags['contact_'+cc]?1:0);
  let p=80-diff*5+(pass-5)*2.5+R.k((lb-c.need)*.35,-20,12)-crime;
  if(liq<r.fee)return bad('پول نقد کافی برای هزینه درخواست نداری');
  if(type==='student'){
   if(ageOf(S)<17)return bad('سن کم'); if(S.edu.uni)return bad('در حال تحصیل هستی');
   const ck=Edu.check(S,x.prog,x.major); if(ck)return bad(ck);
   if(liq<c.fund)return bad('سپرده نقدی حداقل '+M(c.fund,'USD')+' لازم است');
   const ad=Edu.admit(S,cc,x.prog,x.major); p=p*.55+ad*.45+R.k((S.st.sm-50)*.1,-5,5);
  } else if(type==='work'){
   const o=S.offers[cc]; if(!o||o.exp<S.day)return bad('ابتدا باید پیشنهاد کار بگیری (جستجوی کار)');
   if(liq<c.fund*.3)return bad('سپرده نقدی حداقل '+M(c.fund*.3,'USD')+' لازم است');
   if(lb<c.need*.5)return bad('زبان باید حداقل '+P(c.need*.5)+' باشد');
   p+=Math.min(8,S.exp*.8)+(S.edu.lvl-2)*3+o.l*2+8;
  } else if(type==='invest'){
   if(!c.inv)return bad('این کشور مسیر سرمایه‌گذاری ندارد');
   const pv=S.props.filter(q=>q.cc===cc).reduce((a,q)=>a+q.v*FX.mid(S.world,c.cur),0);
   if(pv<c.inv)return bad('ملک به ارزش '+M(c.inv,'USD')+' در این کشور لازم است (داری: '+M(pv,'USD')+')');
   p=88-crime;
  } else if(type==='spouse'){
   const pt=S.fam.pt; if(!pt||!pt.m||pt.nat!==cc)return bad('باید با یک شهروند این کشور ازدواج کرده باشی');
   p=76-c.diff*2-crime+R.k((lb-c.need)*.2,-8,6);
  } else if(type==='resident'){
   const v=S.vis[cc]; if(!v||v.t!=='work')return bad('باید ابتدا ویزای کاری معتبر داشته باشی');
   const need=c.res*12-(v.sp?24:0); if(v.mo<need)return bad('به '+P(Math.ceil(need/12))+' سال اقامت قانونی نیاز داری (داری: '+P(Math.floor(v.mo/12))+')');
   if(lb<c.need)return bad('زبان باید حداقل '+P(c.need)+' باشد');
   p=60+(lb-c.need)*.3+14-diff*2-crime;
  } else if(type==='citizen'){
   const v=S.vis[cc]; if(!v||v.t!=='resident')return bad('ابتدا باید مقیم دائم شوی');
   if(v.mo<c.cit*12)return bad('به '+P(c.cit)+' سال اقامت نیاز داری (داری: '+P(Math.floor(v.mo/12))+')');
   if(lb<c.need+10)return bad('زبان باید حداقل '+P(c.need+10)+' باشد');
   p=62+(lb-c.need-10)*.35-diff*1.5-crime;
  }
  r.p=R.k(p,3,96)/100; return r;
 },
 apply(S,cc,type,x){
  x=x||{}; const e=Mig.eval(S,cc,type,x); if(!e.ok)return e.why;
  Wal.pay(S,e.fee,'USD');
  const d=type==='citizen'?R.i(90,170):type==='invest'?R.i(30,60):R.i(30,90);
  S.apps.push({id:'a'+S.day+type+cc,cc,type,due:S.day+d,p:e.p,x});
  log(S,'درخواست '+VISA_N[type]+' برای '+CTY[cc].n+' ثبت شد','mig'); return 'درخواست ثبت شد؛ نتیجه حدود '+P(Math.round(d/30))+' ماه دیگر';
 },
 resolve(S,a){
  const c=CTY[a.cc], ok=Math.random()<a.p, t=a.type;

   info(S,'درخواست رد شد','متأسفانه درخواست '+VISA_N[t]+' برای '+c.n+' رد شد. می‌توانی بعد از بهتر کردن شرایطت دوباره تلاش کنی.','mig');return}
  const v=S.vis[a.cc]||{mo:0};
  if(t==='student'){S.vis[a.cc]={t:'student',since:S.day,until:S.day+(PROGS[a.x.prog].y+1)*360,mo:v.mo};

  else if(t==='work'){const o=S.offers[a.cc];S.vis[a.cc]={t:'work',since:S.day,until:S.day+3*360,mo:v.mo};

  else if(t==='resident'){S.vis[a.cc]={t:'resident',since:S.day,mo:v.mo}}
  else if(t==='citizen'){Mig.grantCit(S,a.cc)}

  info(S,'خبر خوب!','درخواست '+VISA_N[t]+' برای '+c.n+' تأیید شد.','mig');
 },
 grantCit(S,cc){

 },
 search(S,cc){
  if(Mig.status(S,cc)&&cc===S.country)return 'در همین کشور از بخش شغل اقدام کن';
  const bl=Mig.blocked(S); if(bl)return bl;

  if(Math.random()>p)return 'پیشنهادی در '+c.n+' پیدا نشد';

  return 'پیشنهاد کار گرفتی: '+j.t[l-1]+' در '+c.n+'؛ حالا می‌توانی ویزای کاری بگیری';
 },
 moveCost:(S,cc,city)=>(CTY[cc].col*1.5+250+CTY[cc].diff*40)*(cc===S.country?.35:1),
 canMove(S,cc,city){
  if(cc===S.country&&(city==null||city===S.city))return 'همین‌جا هستی';
  const bl=Mig.blocked(S); if(bl)return bl;
  if(!Mig.status(S,cc))return 'مجوز اقامت در این کشور نداری';
  if(S.edu.uni&&S.edu.uni.cc!==cc)return 'در حال تحصیل در کشور دیگری هستی';
  if(S.pol&&S.pol.on)return 'مسئولیت سیاسی داری';
  if(S.mil&&(S.mil.st==='active'||S.mil.st==='conscript'))return 'در خدمت نظامی هستی';
  return '';
 },
 move(S,cc,free,city){
  city=city||0;
  if(!free){const w=Mig.canMove(S,cc,city);if(w)return w}
  const cost=Mig.moveCost(S,cc,city);
  if(!free&&Wal.avail(S,CTY[cc].cur)<cost*Eco.U(S,cc)-1e-9)return 'پول کافی برای هزینه‌ی جابه‌جایی نداری';
  Wal.pay(S,cost*Eco.U(S,cc),CTY[cc].cur);
  const old=S.country; S.country=cc; S.city=city;
  if(old!==cc)Cars.relocate(S,cc);
  if(S.job&&(S.job.cc!==cc||S.job.city!==city)){S.job=null}
  S.props.forEach(p=>{p.home=false});
  const own=S.props.find(p=>p.cc===cc&&p.city===city); S.house=ageOf(S)<18?'family':'rent'; if(own){own.home=true;S.house='own'}

  log(S,old===cc?'به '+Cty.name(cc,city)+' نقل‌مکان کردی':'به '+Cty.name(cc,city)+'، '+CTY[cc].n+' مهاجرت کردی','mig'); return 'به '+Cty.name(cc,city)+' رسیدی';
 },
 postStudy(S,cc){

  const v=S.vis[cc]||{mo:0}; S.vis[cc]={t:'work',since:S.day,until:S.day+Math.round(1.5*360),mo:v.mo,ps:1};
  info(S,'مجوز کار پس از تحصیل','چون اینجا فارغ‌التحصیل شدی، یک مجوز کار ۱٫۵ ساله گرفتی. در این مدت شغل پیدا کن و مسیر اقامت را ادامه بده.','mig');
 },
 monthly(S){
  for(const cc in S.vis){const v=S.vis[cc];
   if(cc===S.country&&(v.t==='resident'||v.until>S.day)){v.mo+=v.t==='student'?.5:1}
   if(v.t!=='resident'&&v.until-S.day<=60&&v.until>S.day&&!v.warn){
    v.warn=1; const f=Mig.fee(S,cc,'work')*.6;
    if(cc===S.country)S.queue.push({t:'پایان ویزا نزدیک است',d:()=>'ویزای تو در '+CTY[cc].n+' کمتر از دو ماه دیگر تمام می‌شود. تمدید؟ هزینه '+M(f,'USD'),
     c:[{t:'تمدید ویزا',f:S=>{Wal.pay(S,f,'USD');const ok=R.c(R.k(.78+(S.job?.1:-.12)+(S.edu.uni?.08:0)-S.flags.crime*.2,.3,.95));
        if(ok){v.until+=(v.t==='student'?1:2)*360;v.warn=0;log(S,'ویزایت تمدید شد','mig');return 'ویزا تمدید شد'}
        log(S,'تمدید ویزا رد شد','mig');return 'تمدید رد شد؛ باید کشور را ترک کنی'}},
        {t:'ترک کشور',f:S=>{v.warn=2;return 'تصمیم گرفتی برگردی'}}]});
   }
  }
  S.apps=S.apps.filter(a=>{if(a.due<=S.day){Mig.resolve(S,a);return false}return true});
  const v=S.vis[S.country];
  if(v&&v.t!=='resident'&&v.until<=S.day&&!S.cit.includes(S.country)){delete S.vis[S.country];Mig.expel(S)}
  if(!Mig.status(S,S.country)&&!S.cit.includes(S.country))Mig.expel(S);
 },
 expel(S){
  const home=S.cit.includes(S.home)?S.home:S.cit[0]; if(!home||home===S.country)return;
  const from=S.country; S.country=home; S.city=0; Cars.relocate(S,home); S.job=S.job&&S.job.cc===home&&S.job.city===0?S.job:null; S.house='rent'; S.props.forEach(p=>{p.home=false});
  const own=S.props.find(p=>p.cc===home&&p.city===0); if(own){own.home=true;S.house='own'}
  if(S.fam.pt&&S.fam.pt.m)S.fam.pt.cc=home; S.adapt=4; chg(S,{hap:-12});
  log(S,'مجوز اقامتت در '+CTY[from].n+' تمام شد و به '+CTY[home].n+' برگشتی','mig');
  info(S,'بازگشت اجباری','مجوز اقامت تو در '+CTY[from].n+' تمام شد و به '+CTY[home].n+' بازگشتی. املاکت همچنان مال توست.','mig');
 }
};

/* ===== ارتش ===== */
const Mil = {
 init(S){S.mil={st:'none',ob:S.g==='m'&&CTY[S.home].conscr>0?'pending':'none',br:null,rank:0,mo:0,rmo:0,perf:50,path:null,left:0,pen:0,pcc:null,cad:0}},
 pay(S){const m=S.mil;return CTY[S.country].wage*RANK_PAY[m.rank]*BRANCHES[m.br].pay},
 need:S=>S.mil.rank<11?RANK_MO[S.mil.rank]:0,
 thr:S=>55+S.mil.rank*2.2,
 canPromote(S){
  const m=S.mil; if(m.st!=='active'||m.cad>0)return 'امکان‌پذیر نیست';
  if(m.rank>=11)return 'بالاترین درجه را داری';
  if(m.rmo<Mil.need(S))return 'حداقل '+P(Mil.need(S))+' ماه در این درجه لازم است ('+P(m.rmo)+')';
  if(m.perf<Mil.thr(S))return 'عملکرد حداقل '+P(Math.round(Mil.thr(S)))+' لازم است';
  if(m.rank===3&&S.edu.lvl<3)return 'برای افسر شدن مدرک کارشناسی لازم است';
  return '';
 },
 promote(S,auto){
  const m=S.mil, w=Mil.canPromote(S); if(w)return w;
  if(!auto&&!Act.ap(S))return 'امتیاز ماه تمام شده';
  m.rank++; m.rmo=0; chg(S,{hap:7,fame:m.rank>=8?2.2:.6,rep:1});
  log(S,'به درجه '+RANKS[m.rank]+' ارتقا یافتی','mil'); return 'ارتقا به '+RANKS[m.rank];
 },
 course(S){
  const m=S.mil; if(m.st!=='active')return ''; if(!Act.ap(S))return 'امتیاز ماه تمام شده';
  Wal.spend(S,30); m.perf=Math.min(100,m.perf+8); chg(S,{sm:.5,hap:-1}); return 'دوره تخصصی گذراندی؛ عملکردت بهتر شد';
 },
 elig(S,br,path){
  const b=BRANCHES[br], m=S.mil, a=ageOf(S);
  if(m.st==='active'||m.st==='conscript')return 'در حال حاضر در خدمتی';
  if(!S.cit.includes(S.country))return 'فقط شهروندان می‌توانند وارد ارتش شوند';
  if(a<18||a>36)return 'سن مجاز ۱۸ تا ۳۶ سال است';
  if(S.edu.lvl<2)return 'دیپلم لازم است';
  if(S.st.hp<b.hp)return 'سلامت حداقل '+P(b.hp)+' لازم است';
  if(S.st.sm<b.sm)return 'هوش حداقل '+P(b.sm)+' لازم است';
  if(b.major&&!S.edu.deg.some(d=>d.major===b.major))return 'مدرک '+MAJORS[b.major]+' لازم است';
  if(path==='academy'&&(a>24||S.st.sm<55))return 'دانشکده افسری: حداکثر ۲۴ سال و هوش ۵۵+';
  if(path==='degree'&&S.edu.lvl<3)return 'ورود مستقیم افسری با کارشناسی';
  if(S.edu.uni)return 'در حال تحصیل هستی';
  if(S.pol&&S.pol.on)return 'مسئولیت سیاسی داری';
  return '';
 },
 enlist(S,br,path){
  const w=Mil.elig(S,br,path); if(w)return w;
  const m=S.mil; if(S.job)Career.quit(S);
  m.st='active'; m.br=br; m.path=path; m.mo=0; m.rmo=0; m.perf=55; m.pcc=S.country;
  m.rank=path==='degree'?4:0; m.cad=path==='academy'?48:0;
  if(m.ob==='due'||m.ob==='deferred'||m.ob==='pending')m.ob='done';
  log(S,'وارد '+BRANCHES[br].n+' شدی ('+(path==='academy'?'دانشکده افسری':path==='degree'?'افسر با مدرک':'استخدام')+')','mil'); chg(S,{hap:5,fame:.5});
  return 'وارد ارتش شدی';
 },
 retire(S,early){
  const m=S.mil; if(m.st!=='active')return '';
  const y=m.mo/12; let frac=0;
  if(y>=20)frac=Math.min(.75,.5+.0175*(y-20)); else if(y>=15)frac=.3;
  const pay=Mil.pay(S); m.pen=pay*frac; m.pcc=S.country;
  const sev=pay*Math.min(6,y/2); if(sev>0)Wal.earn(S,sev);
  m.st='retired'; m.cad=0; chg(S,{hap:2});
  log(S,'از ارتش بازنشسته شدی'+(frac?' (حقوق بازنشستگی ماهانه)':'')+' با درجه '+RANKS[m.rank],'mil');
  return 'بازنشسته شدی';
 },
 callUp(S){ // ارسال فراخوان
  const m=S.mil; m.ob='due';
  enq(S,{id:'milcall',t:'برگ فراخوان سربازی',k:'mil',d:()=>'به ۱۸ سالگی رسیده‌ای و در '+CTY[S.home].n+' باید خدمت وظیفه ('+P(CTY[S.home].conscr)+' ماه) را بگذرانی. تا تعیین‌تکلیف، خروج از کشور برایت ممنوع است. چه می‌کنی؟',
   c:Mil.callChoices(S)});
 },
 callChoices(S){
  const cc=S.home,mo=CTY[cc].conscr;
  return [
   {t:'خدمت می‌کنم ('+P(mo)+' ماه)',f:S=>{Mil.startConscript(S);return 'پادگان آموزشی در انتظار توست'}},
   {t:'معافیت تحصیلی (اگر دانشجو شوم)',f:S=>{S.mil.ob='deferred';return 'تا زمانی که دانشجو هستی خدمتت عقب می‌افتد. اگر دانشگاه نیافتی بعداً باید تعیین‌تکلیف کنی'}},
   {t:'درخواست معافیت پزشکی',f:S=>{const p=S.st.hp<45?.8:.12;if(Math.random()<p){S.mil.ob='exempt';S.mil.st='exempt';log(S,'معافیت پزشکی گرفتی','mil');return 'معافیت گرفتی'}Mil.startConscript(S);return 'کمیسیون پزشکی معافیت نداد؛ باید خدمت کنی'}},
  ];
 },
 startConscript(S){
  const m=S.mil; m.st='conscript'; m.ob='due'; m.left=CTY[S.country].conscr||CTY[S.home].conscr; m.br='ground'; m.rank=0; m.rmo=0; m.pcc=S.country;
  if(S.job)Career.quit(S); S.edu.uni=null;
  if(S.country!==S.home)Mig.move(S,S.home,true);
  log(S,'دوره سربازی را شروع کردی','mil');
 },
 buyout(S){
  const m=S.mil; if(m.ob!=='due'&&m.ob!=='deferred')return 'نیازی نیست';
  if(!(S.flags.abroadMo>=24||ageOf(S)>=30))return 'خرید خدمت برای مقیم خارج (۲ سال+) یا سن ۳۰+ ممکن است';
  const c=6000*(1+CTY[S.home].conscr/30); if(Wal.avail(S,'USD')<c)return 'پول نقد کافی نداری ('+M(c,'USD')+')';
  Wal.pay(S,c,'USD'); m.ob='done'; log(S,'خدمت وظیفه را با پرداخت وجه تعیین‌تکلیف کردی','mil'); return 'تعیین‌تکلیف شد';
 },
 monthly(S){
  const m=S.mil;
  if(m.st==='conscript'){
   Wal.earn(S,CTY[S.country].wage*.1); m.left--; m.mo++; chg(S,{hap:-.4,hp:.15});
   if(m.left<=0){m.st='done';m.ob='done';m.mo=0;log(S,'دوران سربازی تمام شد','mil');chg(S,{hap:10,rep:2});info(S,'پایان خدمت','دوران سربازی تمام شد. می‌توانی به‌عنوان نظامی حرفه‌ای در ارتش بمانی (بخش ارتش) یا زندگی غیرنظامی را ادامه دهی.','mil')}
  } else if(m.st==='active'){
   m.mo++; m.rmo++;
   const pay=Mil.pay(S)*(m.cad>0?.35:1)*(1-CTY[S.country].tax); Wal.earn(S,pay);
   m.perf=R.k(m.perf+(52+(S.st.sm-50)/5-m.perf)*.08+R.g()*2.5,0,100);
   if(m.cad>0){m.cad--; if(m.cad===0){m.rank=4;m.rmo=0;log(S,'از دانشکده افسری فارغ‌التحصیل شدی: ستوان دوم','mil');chg(S,{hap:10,fame:1})}}
   if(ageOf(S)>=60)Mil.retire(S);
  } else if(m.st==='retired'&&m.pen>0){
   Wal.add(S,CTY[m.pcc].cur,m.pen*Eco.U(S,m.pcc)*(1-CTY[m.pcc].tax*.5));
  }
 },
 yearly(S){
  const m=S.mil; if(m.st!=='active')return;
  const w=Mil.canPromote(S); if(!w&&R.c(.5+(m.perf-Mil.thr(S))/100))Mil.promote(S,true);
  if(m.rank>=8)chg(S,{fame:1.2});
 }
};

/* ===== امنیت و اهمیت ===== */
const Sec = {
 imp(S){
  const usd=Wal.usd(S), pl=S.pol&&S.pol.on?S.pol.l:0, mr=S.mil&&S.mil.st==='active'?S.mil.rank:(S.mil&&S.mil.st==='retired'&&S.mil.rank>=9?S.mil.rank-2:0);
  return R.k(S.st.fame*.5+R.k(Math.log10(Math.max(1,usd/20000))*9,0,25)+(mr>=9?10:mr>=6?4:0)+pl*6+Biz.lvl(S)*3,0,100);
 },
 tier(S){const i=Sec.imp(S);return i<20?0:i<40?1:i<58?2:i<76?3:4},
 state(S){
  const pl=S.pol&&S.pol.on?S.pol.l:0, mr=S.mil&&S.mil.st==='active'?S.mil.rank:0;
  return pl>=4||mr>=10?3:pl>=3||mr>=9?2:pl>=2||mr>=7?1:0;
 },
 level:S=>Math.max(S.sec,Sec.state(S)),
 cost:S=>S.sec>Sec.state(S)?CTY[S.country].wage*SEC_COST[S.sec]:0,
 threat(S){return R.k(Sec.imp(S)*.62+S.st.en*.45+(10-S.world.eco[S.country].stab*0+ (10-CTY[S.country].stab))*1.5-Sec.level(S)*13,0,100)},
 set(S,l){S.sec=l;return 'سطح حفاظت: '+SEC_L[l]},
 monthly(S){
  const c=Sec.cost(S); if(c>0)Wal.spend(S,c);
  const imp=Sec.imp(S); if(imp<18)return;
  const p=.004+Math.pow(Sec.threat(S)/100,2)*.14;
  if(R.c(p)&&S.queue.length<3){const ev=R.w(SEC_EVENTS.filter(e=>imp>=e.min&&!evSeen(S,e)),e=>e.w); if(ev)enq(S,ev)}
 }
};

function randomEvent(S){
  if(!R.c(.38)||S.queue.length>=3)return;
  const pool=LIFE_EVENTS.filter(e=>{try{return !evSeen(S,e)&&(e.when?e.when(S):true)}catch(x){return false}});
  const e=R.w(pool,x=>x.w); if(e)enq(S,e);
}

const Cty={
 get(S,cc,i){const l=CITIES[cc];const k=i==null?(cc===S.country?S.city:0):i;return l[k]||l[0]},
 name:(cc,i)=>(CITIES[cc][i||0]||CITIES[cc][0]).n
};

/* ===== درآمد و هزینه‌ی ماهانه (تخمین یکسان برای رابط و تست) ===== */
function incomeEst(S){
 let t=0; const c=CTY[S.country], cu=Wal.cur(S);
 const conv=(x,from)=>x*FX.mid(S.world,from)/FX.mid(S.world,cu);
 if(S.job&&S.job.cc===S.country)t+=Career.net(S,S.job);
 if(S.mil.st==='active')t+=Mil.pay(S)*(S.mil.cad>0?.35:1)*(1-c.tax)*Eco.U(S,S.country);
 if(S.mil.st==='conscript')t+=c.wage*.1*Eco.U(S,S.country);
 if(S.pol&&S.pol.on)t+=Pol.sal(S);
 if(S.pension>0)t+=S.pension*(1-c.tax)*Eco.U(S,S.country);
 if(S.mil.st==='retired'&&S.mil.pen>0)t+=conv(S.mil.pen*Eco.U(S,S.mil.pcc)*(1-CTY[S.mil.pcc].tax*.5),CTY[S.mil.pcc].cur);
 if(S.fam.pt&&S.fam.pt.m&&S.fam.pt.cc===S.country)t+=c.wage*S.fam.pt.inc*.7*(1-c.tax)*Eco.U(S,S.country);
 S.props.forEach(p=>{if(!p.home)t+=conv(p.v*CTY[p.cc].yld/100/12*.85,CTY[p.cc].cur)});
 if(S.biz)t+=conv(Math.max(0,S.biz.last)*.6,CTY[S.biz.cc].cur);
 return t;
}
function costEst(S){
 if(ageOf(S)<18)return 0;
 const cu=Wal.cur(S); let t=Home.living(S)+Sec.cost(S)*Eco.U(S,S.country);
 (S.cars||[]).forEach(c=>{t+=Cars.run(S,c)*FX.mid(S.world,CTY[c.cc].cur)/FX.mid(S.world,cu)});
 (S.loans||[]).forEach(l=>{t+=l.pay*FX.mid(S.world,l.cur)/FX.mid(S.world,cu)});
 return t;
}

/* ===== اسناد مالکیت و امضای دیجیتال ===== */
function cyrb53(str,seed){
 seed=seed||0; let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;
 for(let i=0,ch;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677)}
 h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
 h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
 return (4294967296*(2097151&h2)+(h1>>>0)).toString(16).toUpperCase().padStart(14,'0');
}
const BUYERS=['خریدار شخصی','شرکت املاک','نمایشگاه‌دار','سرمایه‌گذار محلی'];
const Docs={
 hash:cyrb53,
 body:d=>[d.no,d.kind,d.aid,d.owner,d.own,Math.round(d.price),d.cur,d.date,d.title].join('|'),
 seq(S,kind){S.docSeq=(S.docSeq||0)+1;const y=1405+Math.floor(S.day/360);return (kind==='property'?'P':'V')+'-'+y+'-'+String(S.docSeq).padStart(6,'0')},
 find:(S,no)=>S.docs.find(d=>d.no===no),
 active:(S,aid)=>S.docs.find(d=>d.aid===aid&&d.status==='active'),
 title(a,kind){return kind==='property'?PROP[a.t].n+' در '+Cty.name(a.cc,a.city)+'، '+CTY[a.cc].n:'خودرو '+CARS[a.t].n+' ('+CTY[a.cc].n+')'},
 create(S,kind,asset,price,cur,type,from){
  const d={no:Docs.seq(S,kind),kind,aid:asset.id,title:Docs.title(asset,kind),owner:S.name,own:'me',price,cur,date:S.day,signed:false,sig:null,sigName:'',signDate:null,status:'active',
   hist:[{d:S.day,t:type||'purchase',from:from||'فروشنده',to:S.name,price}]};
  S.docs.push(d); asset.doc=d.no; asset.own='me'; return d;
 },
 sign(S,no,name){
  const d=Docs.find(S,no); if(!d)return 'سند پیدا نشد';
  if(d.status!=='active')return 'این سند دیگر فعال نیست';
  if(d.own!=='me')return 'فقط مالک می‌تواند امضا کند';
  if(d.signed)return 'این سند قبلاً امضا شده';
  name=String(name||'').trim();
  if(!name)return 'نام مالک را برای امضا وارد کن';
  if(name!==S.name.trim())return 'امضا باید دقیقاً با نام مالک ('+S.name+') یکی باشد';
  d.signed=true; d.sigName=name; d.signDate=S.day; d.sig=Docs.hash(Docs.body(d)+'|'+name+'|'+S.day);
  return 'سند امضا شد';
 },
 verify:d=>!!d.signed&&d.sig===Docs.hash(Docs.body(d)+'|'+d.sigName+'|'+d.signDate),
 recipients(S){
  const r=[]; if(S.fam.pt)r.push({k:'p',n:S.fam.pt.n,rel:S.fam.pt.m?'همسر':'شریک'});
  S.fam.kids.forEach((k,i)=>r.push({k:'k'+i,n:k.n,rel:'فرزند'}));
  if(S.par.alive)r.push({k:'par',n:'والدین',rel:'والدین'});
  return r;
 },
 /* محل دارایی: دقیقاً یک جا */
 locate(S,aid){
  let f=[];
  S.props.forEach((a,i)=>{if(a.id===aid)f.push({kind:'property',list:'props',i,a})});
  S.cars.forEach((a,i)=>{if(a.id===aid)f.push({kind:'vehicle',list:'cars',i,a})});
  S.given.forEach((g,i)=>{if(g.asset.id===aid)f.push({kind:g.kind,list:'given',i,a:g.asset})});
  return f;
 },
 gate(S,aid){
  const loc=Docs.locate(S,aid); if(loc.length!==1||loc[0].list==='given')return {err:'دارایی در دسترس نیست'};
  const d=Docs.active(S,aid); if(!d||d.own!=='me')return {err:'سند معتبر پیدا نشد'};
  if(!d.signed||!Docs.verify(d))return {err:'ابتدا سند را امضا کن'};
  if(S.loans.some(l=>l.aid===aid))return {err:'روی این دارایی وام فعال است؛ ابتدا تسویه کن'};
  return {loc:loc[0],d};
 },
 remove(S,loc){if(loc.list==='props')S.props.splice(loc.i,1);else if(loc.list==='cars')S.cars.splice(loc.i,1)},
 sell(S,aid){
  const g=Docs.gate(S,aid); if(g.err)return g.err;
  const a=g.loc.a, d=g.d, kind=g.loc.kind;
  const price=a.v*(kind==='property'?.97:.9), buyer=R.p(BUYERS);
  Wal.add(S,CTY[a.cc].cur,price);
  if(kind==='property'&&a.home){S.house=ageOf(S)<18?'family':'rent'}
  Docs.remove(S,g.loc); d.status='sold'; d.hist.push({d:S.day,t:'sale',from:S.name,to:buyer,price});
  log(S,(kind==='property'?'ملک':'خودرو')+' «'+d.title+'» فروخته شد: '+M(price,CTY[a.cc].cur),'home');
  return 'فروخته شد: '+M(price,CTY[a.cc].cur);
 },
 gift(S,aid,rk){
  const g=Docs.gate(S,aid); if(g.err)return g.err;
  const r=Docs.recipients(S).find(x=>x.k===rk); if(!r)return 'گیرنده نامعتبر است';
  const a=g.loc.a, d=g.d, kind=g.loc.kind;
  d.status='transferred'; d.hist.push({d:S.day,t:'gift',from:S.name,to:r.n+' ('+r.rel+')',price:0});
  Docs.remove(S,g.loc);
  if(kind==='property'&&a.home)S.house=ageOf(S)<18?'family':'rent';
  a.home=false; a.own='fam:'+r.k; a.ownerName=r.n;
  S.given.push({kind,asset:a});
  const nd={no:Docs.seq(S,kind),kind,aid:a.id,title:d.title,owner:r.n,own:a.own,price:a.v,cur:d.cur,date:S.day,signed:true,sigName:r.n,signDate:S.day,sig:null,status:'active',hist:d.hist.slice()};
  nd.sig=Docs.hash(Docs.body(nd)+'|'+r.n+'|'+S.day); S.docs.push(nd); a.doc=nd.no;
  if(S.fam.pt&&r.k==='p')S.fam.pt.mood=Math.min(100,S.fam.pt.mood+6);
  log(S,'«'+d.title+'» را به '+r.n+' ('+r.rel+') بخشیدی','home');
  return 'مالکیت به '+r.n+' منتقل شد';
 },
 seize(S,aid,by){
  const loc=Docs.locate(S,aid); const d=Docs.active(S,aid);
  if(loc.length===1&&loc[0].list!=='given')Docs.remove(S,loc[0]);
  if(d){d.status='seized';d.hist.push({d:S.day,t:'seized',from:S.name,to:by||'بانک',price:0})}
 },
 inherit(S,kind,asset,from){
  const d=Docs.create(S,kind,asset,asset.v,CTY[asset.cc].cur,'inheritance',from);
  return d;
 },
 audit(S){
  const p=[];
  const ids={};
  S.docs.filter(d=>d.status==='active').forEach(d=>{
   ids[d.aid]=(ids[d.aid]||0)+1;
   const loc=Docs.locate(S,d.aid);
   if(loc.length!==1)p.push('دارایی '+d.aid+' در '+loc.length+' جا ثبت شده');
   else{ const a=loc[0].a; if(a.doc!==d.no)p.push('شماره‌ی سند دارایی '+d.aid+' نامطابق'); if(a.own!==d.own)p.push('مالک دارایی '+d.aid+' با سند یکی نیست'); if(loc[0].list==='given'&&d.own==='me')p.push('دارایی بخشیده‌شده هنوز به نام من است'); if(loc[0].list!=='given'&&d.own!=='me')p.push('دارایی من به نام دیگری ثبت شده') }
   if(d.signed&&!Docs.verify(d))p.push('امضای سند '+d.no+' نامعتبر است');
  });
  for(const k in ids)if(ids[k]>1)p.push('دارایی '+k+' دو سند فعال دارد');
  S.props.concat(S.cars).forEach(a=>{if(!Docs.active(S,a.id))p.push('دارایی '+a.id+' سند فعال ندارد')});
  S.given.forEach(g=>{if(!Docs.active(S,g.asset.id))p.push('دارایی بخشیده‌شده '+g.asset.id+' سند فعال ندارد')});
  return p;
 },
 monthly(S){
  S.docs.forEach(d=>{if(d.status==='active'&&d.own==='me'&&!d.signed&&S.day-d.date>=90&&!d.warned){d.warned=1;log(S,'سند «'+d.title+'» هنوز امضا نشده؛ بدون امضا نمی‌توانی آن را بفروشی یا منتقل کنی.','home')}});
 }
};

/* ===== بانک: سپرده، وام و اقساط ===== */
const LOAN_T={
 personal:{n:'وام شخصی',add:.07,cap:15,ns:[12,24,36,60]},
 car:{n:'وام خودرو',add:.05,cap:36,ns:[36,60,72]},
 mortgage:{n:'وام مسکن',add:.035,cap:150,ns:[120,240,360]}
};
const Bank={
 depRate:(S,c)=>Math.max(.003,Eco.rate(S,c)*.85-.002),
 loanRate:(S,c,t)=>Eco.rate(S,c)+LOAN_T[t].add,
 depTotal(S,c){let t=0;for(const k in S.bank.dep)t+=S.bank.dep[k].a*FX.mid(S.world,k);return t/FX.mid(S.world,c)},
 debtTotal(S,c){let t=0;S.loans.forEach(l=>{t+=l.bal*FX.mid(S.world,l.cur)});return t/FX.mid(S.world,c)},
 net:(S,c)=>Bank.depTotal(S,c)-Bank.debtTotal(S,c),
 out(S,k,amt,toWallet){
  const d=S.bank.dep[k]; if(!d||amt<=0)return;
  const t=Math.min(amt,d.a), cm=d.a>0?d.c*(t/d.a):0;
  d.a-=t; d.c-=cm; if(d.a<1e-7)delete S.bank.dep[k];
  if(toWallet)Wal.add(S,k,t,cm);
 },
 pull(S,c,need){
  const dep=S.bank.dep;
  if(dep[c]&&dep[c].a>0&&need>1e-9){const t=Math.min(dep[c].a,need);Bank.out(S,c,t,false);need-=t}
  const ks=Object.keys(dep).filter(k=>k!==c).sort((a,b)=>dep[b].a*FX.mid(S.world,b)-dep[a].a*FX.mid(S.world,a));
  for(const k of ks){
   if(need<=1e-9)break; const e=FX.eff(S.world,k,c), av=dep[k].a*e;
   if(av>=need){Bank.out(S,k,need/e,false);need=0}else{need-=av;Bank.out(S,k,dep[k].a,false)}
  }
  return need;
 },
 deposit(S,c,amt){
  if(!(amt>0))return 'مقدار نامعتبر است'; if(c==='XAU')return 'طلا سپرده‌ی بانکی ندارد';
  const h=S.wal[c]; if(!h||h.a<amt-1e-9)return 'موجودی نقد کافی نیست';
  amt=Math.min(amt,h.a); const cm=h.c*(amt/h.a);
  Wal.rem(S,c,amt); const d=S.bank.dep[c]||(S.bank.dep[c]={a:0,c:0}); d.a+=amt; d.c+=cm;
  return 'سپرده شد';
 },
 withdraw(S,c,amt){
  const d=S.bank.dep[c]; if(!(amt>0))return 'مقدار نامعتبر است';
  if(!d||d.a<amt-1e-9)return 'موجودی سپرده کافی نیست';
  Bank.out(S,c,Math.min(amt,d.a),true); return 'برداشت شد';
 },
 outstanding(S,lc){let t=0;S.loans.forEach(l=>{t+=l.bal*FX.mid(S.world,l.cur)/FX.mid(S.world,lc)});return t},
 maxLoan(S,t,lc){
  lc=lc||Wal.cur(S); const cu=Wal.cur(S);
  const inc=incomeEst(S)*FX.mid(S.world,cu)/FX.mid(S.world,lc);
  return Math.max(0,inc*LOAN_T[t].cap-Bank.outstanding(S,lc));
 },
 eligible(S,t,amt,n,lc){
  lc=lc||Wal.cur(S);
  if(!LOAN_T[t])return 'نوع وام نامعتبر است';
  if(ageOf(S)<18)return 'برای وام باید ۱۸ سال داشته باشی';
  if(!(amt>0))return 'مبلغ نامعتبر است';
  if(!LOAN_T[t].ns.includes(n))return 'تعداد اقساط مجاز نیست';
  if(S.credit<450)return 'امتیاز اعتباری‌ات کافی نیست ('+P(S.credit)+')';
  if(S.loans.length>=5)return 'حداکثر ۵ وام هم‌زمان مجاز است';
  if(incomeEst(S)<=0)return 'برای وام باید درآمد ثابت داشته باشی';
  if(amt>Bank.maxLoan(S,t,lc)+1e-6)return 'مبلغ از سقف مجاز تو بیشتر است: '+M(Bank.maxLoan(S,t,lc),lc);
  return '';
 },
 create(S,t,lc,amt,n,aid,direct){
  const r=Bank.loanRate(S,lc,t)/12, pay=amt*r/(1-Math.pow(1+r,-n));
  const l={id:'l'+S.day+Math.floor(Math.random()*99999),type:t,cur:lc,p0:amt,bal:amt,r,n,left:n,pay,missed:0,start:S.day,aid:aid||null,paid:0};
  S.loans.push(l);
  if(!direct){const fee=amt*.01;Wal.add(S,lc,amt-fee)}
  return l;
 },
 take(S,t,amt,n){
  const e=Bank.eligible(S,t,amt,n); if(e)return e;
  const l=Bank.create(S,t,Wal.cur(S),amt,n,null,false);
  log(S,LOAN_T[t].n+' '+M(amt,l.cur)+' گرفتی؛ قسط ماهانه '+M(l.pay,l.cur),'fin');
  return 'وام دریافت شد؛ قسط ماهانه '+M(l.pay,l.cur);
 },
 repay(S,id,amt){
  const l=S.loans.find(x=>x.id===id); if(!l)return 'وام پیدا نشد';
  if(!(amt>0))return 'مبلغ نامعتبر است';
  amt=Math.min(amt,l.bal);
  if(Wal.avail(S,l.cur)<amt-1e-9)return 'پول کافی نداری';
  Wal.pay(S,amt,l.cur); l.bal-=amt; l.paid+=amt;
  if(l.bal<=.01){Bank.close(S,l,true);return 'وام کاملاً تسویه شد'}
  return 'مبلغ از اصل وام کم شد';
 },
 close(S,l,ok){
  S.loans=S.loans.filter(x=>x!==l);
  if(ok){S.credit=Math.min(850,S.credit+15);log(S,LOAN_T[l.type].n+' تسویه شد','fin')}
 },
 monthly(S){
  // بهره‌ی سپرده
  for(const k in S.bank.dep){const d=S.bank.dep[k];d.a*=1+Bank.depRate(S,k)/12}
  // اقساط
  S.loans.slice().forEach(l=>{
   const due=Math.min(l.pay,l.bal*(1+l.r));
   if(Wal.avail(S,l.cur)>=due-1e-9){
    Wal.pay(S,due,l.cur); l.bal=l.bal*(1+l.r)-due; l.left--; l.missed=0; l.paid+=due;
    S.credit=Math.min(850,S.credit+(l.left%6===0?3:1));
    if(l.left<=0||l.bal<=.5){l.bal=0;Bank.close(S,l,true)}
   } else {
    l.missed++; l.bal=l.bal*(1+l.r)+due*.03; S.credit=Math.max(300,S.credit-25); chg(S,{rep:-3,hap:-2});
    log(S,'قسط '+LOAN_T[l.type].n+' پرداخت نشد (بار '+P(l.missed)+')','fin');
    if(l.missed>=3){
     if(l.aid){Docs.seize(S,l.aid,'بانک');log(S,'به‌خاطر عدم پرداخت اقساط، دارایی وثیقه توسط بانک ضبط شد','fin')}
     else{S.flags.bk=(S.flags.bk||0)+1;chg(S,{rep:-15,hap:-8});log(S,'وام شخصی نکول شد و سابقه‌ی اعتباری‌ات خراب شد','fin')}
     S.credit=300; Bank.close(S,l,false);
     S.queue.push({t:'نکول وام',k:'fin',d:()=>'چند قسط پشت‌سرهم پرداخت نشد و بانک وام را نکول‌شده اعلام کرد.'+(l.aid?' وثیقه ضبط شد.':''),c:[{t:'ادامه'}]});
    }
   }
  });
  // امتیاز اعتباری به‌تدریج به ۶۰۰ نزدیک می‌شود
  if(!S.loans.some(l=>l.missed>0))S.credit+= (650-S.credit)*.01;
 }
};

/* ===== خودرو ===== */
const Cars={
 price:(S,cc,t)=>CARS[t].usd*(CARM[cc]||1)*Eco.U(S,cc),
 run(S,c){return CARS[c.t].run*R.k(CTY[c.cc].col/1100,.25,1.4)*Eco.U(S,c.cc)},
 fee:p=>p*.01,
 buy(S,t,loanN){
  if(ageOf(S)<18)return 'برای خرید خودرو باید ۱۸ سال داشته باشی';
  const cc=S.country, cu=CTY[cc].cur, pr=Cars.price(S,cc,t), down=loanN?pr*.2:pr, fee=Cars.fee(pr);
  if(Wal.avail(S,cu)<down+fee-1e-9)return 'پول کافی نداری';
  if(loanN){const e=Bank.eligible(S,'car',pr*.8,loanN,cu);if(e)return e}
  Wal.pay(S,down+fee,cu);
  const c={id:'c'+S.day+Math.floor(Math.random()*99999),t,cc,city:S.city,price:pr,v:pr,cond:100,km:0,broken:false,own:'me'};
  S.cars.push(c); Docs.create(S,'vehicle',c,pr,cu,'purchase','نمایشگاه خودرو');
  if(loanN)Bank.create(S,'car',cu,pr*.8,loanN,c.id,true);
  log(S,'خودرو '+CARS[t].n+' خریدی: '+M(pr,cu),'home'); chg(S,{hap:4});
  return 'خودرو خریدی؛ سند را امضا کن';
 },
 own:(S,id)=>S.cars.find(c=>c.id===id),
 serviceCost:c=>c.price*.015,
 service(S,id){
  const c=Cars.own(S,id); if(!c)return 'خودرو پیدا نشد'; if(c.broken)return 'خودرو خراب است؛ ابتدا تعمیر کن';
  const cost=Cars.serviceCost(c), cu=CTY[c.cc].cur;
  if(c.cc!==S.country)return 'خودرو در کشور دیگری است';
  if(Wal.avail(S,cu)<cost)return 'پول کافی نداری';
  Wal.pay(S,cost,cu); c.cond=Math.min(100,c.cond+20); return 'سرویس انجام شد';
 },
 repairCost(c,mode){return c.price*(mode==='official'?.06:.028)*(1+(60-Math.min(60,c.cond))/100)},
 repair(S,id,mode){
  const c=Cars.own(S,id); if(!c)return 'خودرو پیدا نشد'; const cu=CTY[c.cc].cur;
  if(mode==='leave')return 'فعلاً رها شد';
  if(mode==='junk'){
   const d=Docs.active(S,c.id), pr=c.v*.3; Wal.add(S,cu,pr); Docs.remove(S,Docs.locate(S,c.id)[0]);
   if(d){d.status='sold';d.hist.push({d:S.day,t:'sale',from:S.name,to:'قراضه‌فروشی',price:pr})}
   S.loans.filter(l=>l.aid===c.id).forEach(l=>{l.aid=null});
   return 'به‌عنوان قراضه فروخته شد: '+M(pr,cu);
  }
  const cost=Cars.repairCost(c,mode);
  if(c.cc!==S.country)return 'خودرو در کشور دیگری است';
  if(Wal.avail(S,cu)<cost)return 'پول کافی برای تعمیر نداری ('+M(cost,cu)+')';
  Wal.pay(S,cost,cu);
  if(mode==='official'){c.cond=88;c.broken=false;return 'تعمیر کامل شد'}
  if(R.c(.7)){c.cond=62;c.broken=false;return 'تعمیر ارزان انجام شد'}
  c.cond=50;c.broken=false;return 'تعمیر موقت بود و ممکن است دوباره خراب شود';
 },
 breakEvent(S,c){
  const cu=CTY[c.cc].cur, o=Cars.repairCost(c,'official'), ch=Cars.repairCost(c,'cheap');
  return {t:'خرابی خودرو',k:'home',when:S=>!!Cars.own(S,c.id)&&Cars.own(S,c.id).broken,

 if(UI.mode==='create'){q('#app').innerHTML=createHtml();q('#ov').innerHTML='';return}
 ensureShell();
 const pk=pageKey(); const mn=q('#mn'); const keep=UI.page===pk&&mn?mn.scrollTop:0; UI.page=pk;
 q('#hd').innerHTML=headerHtml();
 mn.innerHTML=pageHtml(); mn.scrollTop=keep;
 q('#dk').innerHTML=dockHtml();
 q('#nv').innerHTML=navHtml();
 renderOv();

function waitHtml(){
 const w=UI.wait; const a=w.age;
 return `<div class="bd mid" id="waitbd"><div class="sheet ctr" role="dialog" aria-modal="true" aria-live="polite"><div class="sh-b" style="align-items:center;text-align:center;gap:14px;padding:26px 18px">${WHEEL.replace('class="wheel"','class="wheel spin"')}<h2 style="margin:0">یک سال در راه است…</h2><div class="sm muted">${P(a)} ساله ← ${P(a+1)} ساله</div><div class="bar" style="width:100%"><i id="waitbar" style="width:0%;background:var(--accent)"></i></div><div class="sm muted" id="waitlbl">${P(w.sec)} ثانیه</div></div></div></div>`;

function renderOv(){
 const ov=q('#ov');

/* ===== نمودار ===== */
function lineChart(vals,pos){
 const W=320,H=150,pl=46,pr=8,pt=10,pb=10;
 let mn=Math.min(...vals),mx=Math.max(...vals); if(mx-mn<mn*1e-6){mx=mn*1.01;mn=mn*.99}
 const pad=(mx-mn)*.08; mn-=pad; mx+=pad;
 const x=i=>pl+(W-pl-pr)*i/(vals.length-1), y=v=>pt+(H-pt-pb)*(1-(v-mn)/(mx-mn));
 const pts=vals.map((v,i)=>x(i).toFixed(1)+','+y(v).toFixed(1));
 const line='M'+pts.join(' L'), area=line+` L${x(vals.length-1).toFixed(1)},${H-pb} L${pl},${H-pb} Z`;
 let g='';
 for(let i=0;i<4;i++){const v=mn+(mx-mn)*(i/3),yy=y(v);g+=`<line x1="${pl}" x2="${W-pr}" y1="${yy.toFixed(1)}" y2="${yy.toFixed(1)}" stroke="var(--line)" stroke-width="1" stroke-dasharray="${i?'3 3':'0'}"/><text x="${pl-5}" y="${(yy+3).toFixed(1)}" text-anchor="end">${rt(v)}</text>`}
 const lx=x(vals.length-1),ly=y(vals[vals.length-1]);
 return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${pos||'نمودار'}" dir="ltr">${g}<path d="${area}" fill="currentColor" fill-opacity=".13"/><path d="${line}" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="4" fill="currentColor"/></svg>`;
}

function fxOrder(){
 const base=['USD','EUR','GBP','XAU','AED','TRY','CHF','CAD','AUD','JPY'];
 return base.concat(Object.keys(CUR).filter(k=>!base.includes(k)).sort((a,b)=>CUR[a].n.localeCompare(CUR[b].n,'fa')));
}
function fxState(){
 const quote=cur(); UI.quote=quote;
 let sel=UI.sel&&CUR[UI.sel]&&UI.sel!==quote?UI.sel:(quote==='USD'?'EUR':'USD'); UI.sel=sel;
 return {quote,sel};
}
function tradeMax(){
 const {quote,sel}=fxState(), t=UI.tr;
 if(t.side==='buy'){const b=Math.max(0,(S.wal[quote]||{a:0}).a);return b*FX.eff(S.world,quote,sel)}
 return Math.max(0,(S.wal[sel]||{a:0}).a);
}
function tradePreview(){
 const {quote,sel}=fxState(), t=UI.tr, x=num(t.amt);
 if(!(x>0))return '<span class="muted">مقدار را وارد کن</span>';
 if(t.side==='buy'){
  const cost=x/FX.eff(S.world,quote,sel), have=Math.max(0,(S.wal[quote]||{a:0}).a);
  return `پرداخت: <b>${fm(cost)} ${CUR_SHORT[quote]}</b>${cost>have+1e-9?' <span class="bad">· موجودی کافی نیست</span>':''}`;
 }
 const got=x*FX.eff(S.world,sel,quote), have=Math.max(0,(S.wal[sel]||{a:0}).a);
 return `دریافت: <b>${fm(got)} ${CUR_SHORT[quote]}</b>${x>have+1e-9?' <span class="bad">· موجودی کافی نیست</span>':''}`;
}

 });
 const list=fxOrder().filter(k=>k!==quote).map(k=>{

 }).join('');

 <div class="card"><div class="hero-fx"><span class="sm muted">${FLAG_OF_CUR[sel]||''} ۱ ${CUR[sel].n} به ${CUR[quote].n}</span><div class="big num">${rt(price)}</div><div class="chg">${chg('امروز',ch.d)}${chg('ماه',ch.m)}${chg('سال',ch.y)}</div></div>
 <div class="seg">${[['d','روزانه'],['m','ماهانه'],['y','سالانه']].map(x=>`<button class="${UI.range===x[0]?'on':''}" data-a="range" data-p="${x[0]}">${x[1]}</button>`).join('')}</div>

 <div class="xs muted">${UI.range==='d'?'۳۰ روز اخیر':UI.range==='m'?'۲ سال اخیر (ماهانه)':'۲۰ سال اخیر (سالانه)'}</div></div>

 <div class="grid2">${kv('نرخ خرید (می‌پردازی)',rt(buyPx)+' '+CUR_SHORT[quote])}${kv('نرخ فروش (می‌گیری)',rt(sellPx)+' '+CUR_SHORT[quote])}</div>
 <label for="tramt" class="sm muted">مقدار ${CUR[sel].n} برای ${t.side==='buy'?'خرید':'فروش'}</label>
 <input id="tramt" type="text" inputmode="decimal" autocomplete="off" value="${esc(t.amt)}" placeholder="مثلاً ${t.side==='buy'?'۱۰۰۰':'۵۰۰'}">
 <div class="chips">${[25,50,75,100].map(p=>`<button class="chip" data-a="pct" data-p="${p}">${P(p)}٪</button>`).join('')}</div>

};

  case 'cands':UI.cands=Fam.candidates(S);return;
  case 'ask':{const c=UI.cands&&UI.cands[+arg];if(!c)return;const r=Fam.ask(S,c);UI.cands.splice(+arg,1);if(S.fam.pt)UI.cands=null;return r}
  case 'job':return Career.apply(S,arg);
  case 'pol':return Pol.run(S,+arg);
  case 'sec':return Sec.set(S,+arg);
  case 'promote':return Mil.promote(S);
  case 'course':return Mil.course(S);
  case 'buyout':return Mil.buyout(S);
  case 'bizW':return Biz.withdraw(S);
  case 'bizI':return Biz.invest(S,.25);

A.year=()=>{

 const age=ageOf(S), sec=Game.waitSec(age);
 UI.wait={t0:Date.now(),dur:sec*1000,age,sec,day0:S.day,done:false};

};
function waitTick(){
 const w=UI.wait; if(!w){clearInterval(WAIT.t);return}
 const el=Date.now()-w.t0, p=Math.min(1,el/w.dur);
 const b=q('#waitbar'); if(b)b.style.width=(p*100).toFixed(1)+'%';
 const l=q('#waitlbl'); if(l)l.textContent=P(Math.max(0,Math.ceil((w.dur-el)/1000)))+' ثانیه';
 if(p>=1)waitFinish();
}
function waitFinish(){
 const w=UI.wait; if(!w||w.done)return; w.done=true;        // فقط یک‌بار
 clearInterval(WAIT.t); WAIT.t=null;
 try{ if(S&&!S.dead&&S.day===w.day0){Game.advanceYear(S); UI.cands=null} }catch(e){console.error(e);toast('خطا: '+e.message)}
 UI.wait=null;
 const ov=q('#ov'); if(ov)ov.innerHTML='';
 try{render()}catch(e){console.error(e)}
 if(S&&!S.dead)toast(S.queue.length?'یک سال گذشت؛ رویدادی پیش آمد':'یک سال گذشت');
}

 if(s.k==='dep')return Math.max(0,(S.wal[s.cu]||{a:0}).a);

 return 0;
}

function actWhy(S,o){
 const a=ageOf(S);
 if(a<(o.min||0))return 'از '+P(o.min)+' سالگی';
 if(o.when&&!o.when(S))return o.id==='parttime'?'شاغلی':'شغل نداری';
 if(o.need&&!o.need(S))return 'شرایطش را نداری';
 if(o.usd&&Wal.avail(S,Wal.cur(S))<o.usd*Eco.U(S,S.country)*.5&&!(S.house==='family'&&a<18))return 'پول کافی نیست';
 return '';
}
function actEffText(o){
 const N={hp:'سلامت',hap:'شادی',sm:'هوش',lk:'ظاهر',rep:'اعتبار',fame:'شهرت'}, t=[];
 for(const k in (o.fx||{}))t.push(N[k]+(o.fx[k][1]<=0?' −':' +'));
 if(o.free)t.push('درآمد');if(o.call==='parttime')t.push('درآمد');if(o.call==='overtime')t.push('عملکرد شغلی');
 return t.join(' · ');
}
SHEET.actf=s=>{

 const items=g.o.map(o=>{

  const kid=ageOf(S)<18&&S.house==='family';
  const cost=o.usd?(kid?'خرجش با خانواده · ':'هزینه: '+L$(o.usd*Eco.U(S,S.country),CTY[S.country].cur)+' · '):'';
  return `<div class="item" style="cursor:default"><span class="tt"><b>${o.n}</b><span>${o.d} · ${cost}${actEffText(o)}</span></span>${why?`<span class="pill">${why}</span>`:btn('انجام بده','af',g&&s.cat+':'+o.id,'sm')}</div>`;
 }).join('');
 return sheetWrap(g.n,`<div class="sm muted">${g.q} هر بار یک امتیاز ماهانه مصرف می‌شود (باقی‌مانده: ${P(S.ap)}).</div><div style="display:flex;flex-direction:column">${items}</div>`);
};

  if(S.ap<=0)UI.sheet=null;return (o.id==='tutor'?'تدریس کردی':'پروژه‌ی فریلنس گرفتی')+': '+M(v*(1-CTY[S.country].tax)*Wal.U(S),Wal.cur(S))}
 const d={};for(const k in o.fx){const [a,b]=o.fx[k];d[k]=+(R.r(a,b)).toFixed(2)}chg(S,d);
 if(S.ap<=0)UI.sheet=null;
 return o.msg;
};

 function start(d){

 }

})();
